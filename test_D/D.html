tion": 0.5755935272884299}, {"start": 56, "text": "0:56  I love it how he was actually like any other house cat, hesitated to go into the water at first. But then seconds after that he was like \"Fuck it, I need to find some food to survive.\"", "correlation": 0.5517310228748871}, {"start": 57, "text": "0:57 I like how many times it touched the water before it finally went in", "correlation": 0.5167846965528553}, {"start": 57, "text": "yes but 00:57 to this little fella it must feel as if he is treading though the Louisiana bayou...its treacherous waters covered by a carpet of glossy leaves and green moss that bob with the movements of hidden life beneath and broken tree trunks that loom through the mist like ghostly sentinels", "correlation": 0.4507871587789303}, {"start": 57, "text": "0:57 A cat in the water? And it was his own decision?! No, it should be fake...", "correlation": 0.4203000980538336}, {"start": 58, "text": "0:58 is cutest pet for me when he swim", "correlation": 0.4751292702066422}, {"start": 59, "text": "0:59 Whoa, wtf... did this cat walk into water?  From my experience with cats, the momment they hear the shower they run away as if their lives depend on it", "correlation": 0.5795928269203476}, {"start": 59, "text": "0:59 it's not a cat", "correlation": 0.42675145602286807}, {"start": 60, "text": "1:00 Cat on the water   Me: IMPOSSIBLE", "correlation": 0.5100011432493314}, {"start": 60, "text": "1:00 wait i thought cats hated water", "correlation": 0.4455878450255864}, {"start": 60, "text": "1:00 finally it was recorded! Water-Cat union!", "correlation": 0.42076259700827656}, {"start": 61, "text": "1:01 WOAH IT LIKES WATER?!?!", "correlation": 0.6103914868691953}, {"start": 61, "text": "Im dyinggg so much that little tiny feet touch walk across the water 1:01 😭😭😭💕💕", "correlation": 0.5380496410727752}, {"start": 61, "text": "Wait! Is it a cat or squirrel @1:01??", "correlation": 0.5121852030003489}, {"start": 61, "text": "1:01 i thought Kitten scare from Water", "correlation": 0.4773487502851994}, {"start": 62, "text": "The cat have to swim in a puddle 1:02 wow", "correlation": 0.5661461411220525}, {"start": 62, "text": "He had to swim through a puddle lol  1:02", "correlation": 0.5068025174223668}, {"start": 62, "text": "1:02 forget the fake cat, that piece of grass next to it really adds to the plot", "correlation": 0.45895359973551664}, {"start": 62, "text": "1:02   Uhhhh.... Since when do cats like water????", "correlation": 0.4305959111044969}, {"start": 63, "text": "1:03  Everyone: cat hate water Cat: *uno reverse card*", "correlation": 0.4508948731161385}, {"start": 63, "text": "I don’t know, its pretty cute and all  But I don’t see it working underwater..  1:03  ”I’ll TAKE YOUR ENTIRE STOCK”", "correlation": 0.4476098765022065}, {"start": 64, "text": "1:04 uh uh uh fake video  its an animated video  cats dont like water", "correlation": 0.5610716082412261}, {"start": 64, "text": "1:04 he just past the water like that and me here applying medicine on the scratches i got from my cat while giving it a bath.", "correlation": 0.4894544465669945}, {"start": 64, "text": "1:04 it’s an otter !!!", "correlation": 0.4866616803899422}, {"start": 64, "text": "1:04 smol swim", "correlation": 0.4262741743760405}, {"start": 65, "text": "1:05 a cat that doesn't hates water", "correlation": 0.5314303168377394}, {"start": 65, "text": "1:05 the little splashes ✋", "correlation": 0.43515815725512386}, {"start": 67, "text": "1:07 Young cats are born curious  So what, old cats are born non-curious?", "correlation": 0.8643108917582136}, {"start": 67, "text": "1:07 \"Young cats are born curious.\"  Okay, so how are old cats born?", "correlation": 0.7666492946601027}, {"start": 67, "text": "Young cats are born curious", "correlation": 0.7137384111906624}, {"start": 67, "text": "1:07 \"Young cats are born curious...\"  Let's just say \"Cats are born curious\", or \"Young cats are curious\".", "correlation": 0.6746314309245915}, {"start": 67, "text": "Young cats are born curious, which ironic.", "correlation": 0.6587083911469214}, {"start": 67, "text": "Young cats are born  curious     Hey bbc my 14 year old cat is always curious 😂", "correlation": 0.6471585162964409}, {"start": 67, "text": "\"Young cats are born curious\". There goes the saying!", "correlation": 0.6374409997958853}, {"start": 67, "text": "Old cats are born curious", "correlation": 0.633263512708486}, {"start": 67, "text": "\"Young cats are born curious\" Ehmm, all cats are born young..", "correlation": 0.632608700741122}, {"start": 67, "text": "\"Young cats are born curious.\" It's not like they lose such trait when they grow. 😐", "correlation": 0.6279957562010053}, {"start": 67, "text": "Young cats are curious...that's how they learn about the world  P A R K O U R", "correlation": 0.6248071587014907}, {"start": 67, "text": "\"Young cats are born curious\" OH NO NOT THE WORD CURIOUS", "correlation": 0.609175127022331}, {"start": 67, "text": "\"Young cats are born curious. It's how they learn about the world. Even if it gets them into trouble\"  So, just like humans", "correlation": 0.6032523173266346}, {"start": 67, "text": "\"Young cats are born curious\" ah yes, Same as humans but school teachers ducks up curiosity.", "correlation": 0.5986923500177066}, {"start": 67, "text": "cats are curious", "correlation": 0.5902194782770717}, {"start": 67, "text": "“Young cats are born curious”  Cat: oh look water YEET", "correlation": 0.5894553313878266}, {"start": 67, "text": "'Young cats are borne curious'. Not old ones?", "correlation": 0.5823818478932771}, {"start": 67, "text": "Young cats are born curious   Yeah well curiosity killed the cat..so..yeah.", "correlation": 0.5823466618620826}, {"start": 67, "text": "\"Young cats are born curious\" What about old cats, are they also born curious?", "correlation": 0.5820857245211053}, {"start": 67, "text": "\"Young cats are born curious\" Yeah and old cats are born passive🤦‍♂", "correlation": 0.5770969323304214}, {"start": 68, "text": "FAKE ALERT: 1:08 that’s just a normal sized stream but they edited fake big leaves. Still this video is the best", "correlation": 0.6515060992108597}, {"start": 69, "text": "1:09 It's true and finally confirmed. Cats don't like water 😂", "correlation": 0.5882384513893186}, {"start": 70, "text": "1:10 Contemplating what would happen if he got wet.", "correlation": 0.47407596184980993}, {"start": 71, "text": "a kid in my class showed this video to us because we are studying rainforest and it’s cute. Tbh we use iPads and we can do anything we want if it’s not too loud and the teachers don’t see AND we get rid of any evidence.", "correlation": 0.4725524349401343}, {"start": 71, "text": "Is this even real? The leaves next to that stream look too huge to be real.", "correlation": 0.46953586824483295}, {"start": 71, "text": "What is a nature video without a person with an Australian accent narrating it?", "correlation": 0.4237520838066737}, {"start": 71, "text": "1:11  Cat: you Water: relatives", "correlation": 0.4082906814806986}, {"start": 72, "text": "0:15 such a cute baby .. how can he survive in this forest 1:12 hmm guess am wrong", "correlation": 0.5803487722056668}, {"start": 73, "text": "This kitten isn't that small really,At 1:13 that river is measured 17 feet across and this tiny kitten jumped over it!!", "correlation": 0.6617142630385778}, {"start": 73, "text": "1:13 Aww, the little baby wants to jump across the river--Oh shoot he just did", "correlation": 0.6265407556589497}, {"start": 73, "text": "1:13 3rd grade me jumping over a puddle", "correlation": 0.5222395798256676}, {"start": 73, "text": "1:13 that leap is so beautiful...", "correlation": 0.4434450221952584}, {"start": 73, "text": "Most gracious jump ever 1:13", "correlation": 0.40903319499162427}, {"start": 74, "text": "0:41 smol cat is gently jumping over a leaf 🍁 1:14 smol cat is doing a big jump", "correlation": 0.5147566025113808}, {"start": 74, "text": "@d actually it is. at 1:14 when it jumps the creek, its leaves no impression in the wet sand when it landed, nor does it kick up any sand at all when it runs off.", "correlation": 0.4879045477095174}, {"start": 74, "text": "01:14, looks like a mini leopard.", "correlation": 0.41106581519453117}, {"start": 74, "text": "1:14 that jump", "correlation": 0.40525293665838547}, {"start": 76, "text": "Chaotic Fyre it's a real animal but the video itself is a mix of real footage and cgi, I'm guessing the cgi being used to show examples of what the animal can do.", "correlation": 0.631917799909997}, {"start": 76, "text": "1:16 yep just 6ft leaves beside a river that a miniature cat just crossed 😂 this is so fake", "correlation": 0.6009476718026636}, {"start": 76, "text": "@Firedrake Smolder It's mixed video footage, from a zoo topped with CGI shots. A trained eye can separate CGI animations from real movements. It's very convincing yes, but it's not impossible to see. In the zoo, most of the shots are from the cat sitting still. The river shots are obviously made using CGI because you can't fit a river like that inside a enclosure at a zoo. And it's cheaper and more convinient to make a few minutes of good CGI than actually spending weeks and weeks in a djungle trying to track down an extremely small and rare animal. Get real!", "correlation": 0.5735500276883184}, {"start": 76, "text": "Some parts of the video are CGI but some are also real footages. It is hard to capture a video or picture of these species since it is rare, small and wild. It has a strong sense so it knows when an entity is near it.", "correlation": 0.571517490534245}, {"start": 76, "text": "Doesn’t this look like the beginning of a movie? Like there’s an animal running around and a voice in the background", "correlation": 0.5715111788228898}, {"start": 76, "text": "1:16 Ye, naah after hearing this tiny little meow of pain after branch broke and he fell you aren't convincing me no more about what a predator this lil creature is :D", "correlation": 0.5612892377097335}, {"start": 76, "text": "Name of the animal please?", "correlation": 0.5600219263501287}, {"start": 76, "text": "Whats the name of the animal????", "correlation": 0.5496314099461914}, {"start": 76, "text": "This is definitely fake. Not saying the animal doesn't exist, but some of these footage isn't real. I think the film crew got a few real shots, like when it's poking its head out from behind the leaf, but the scenes of it jumping around are computer generated. It's just a really good animation. It doesn't look right. That's my theory anyway.", "correlation": 0.5432126209614092}, {"start": 76, "text": "It’s a camera that is far away  and they zoom into the animal and make it seem like the camera man is really close to the animal", "correlation": 0.5366468909070046}, {"start": 76, "text": "Why am I being shown a CGI cat walk around a forest?", "correlation": 0.5341630663910274}, {"start": 76, "text": "@thominhasss  The videography is real, even if it seems hard to believe, there are ways to obtain footage of very rare wild animals such as this. It would take significantly way more effort to animate this than record footage…", "correlation": 0.5336173248223505}, {"start": 76, "text": "Usually they put the animal  in a closed environment with lightings and cameras everywhere to take quality pictures like that. So they don't have to go to the jungle for months to find a specimen. They just ask to a zoo or an animal shelter. In that case, its unfortuately CGI. Quite impressive CGI but CGI. Btw the cat is bigger than shown in the video.", "correlation": 0.5335065376782983}, {"start": 76, "text": "@ErgonomicDesk  You are wrong. Finding a rare animal in nature is extremely long and expensive. You will NEVER find real footages that quality in a natural environment. Today, creating CGI like this is quite easy and not as expensive as paying a trip to jungle for months, with expensive cameras, etc... Here are 3 ways to realise that kind of footage : 1 - Natural footage -> extremely long, expensive and RANDOM. Even with modern technologies, most of studios releasing that kind of documentary don't even travel to take that kinf of footage, too expensive and hard. 2- Studio footage in artificial environment -> Call a Zoo or an animal shelter, find your star, put it in a 5m² room with plants, studio lighting, and cameras everywhere, film everything. You will have excellent quality footage like in this video, but with a real animal. 3 - CGI -> Take the artifical environment that you created and make a CGI cat appear, or you can create everything with CGI. Today, its easy to find footages like that.  The video is at least 50% CGI. The cat moving is full CGI. That's why the movie is so short.", "correlation": 0.5298841136533586}, {"start": 76, "text": "This was in fact animated. Nature documentaries aren't capable of capturing enough good footage of such small creatures, so they build entirely man-made sets, create fake sounds, and animate over top of it. They did a fantastic job though, it took me a bit to realize.", "correlation": 0.5219448666226185}, {"start": 76, "text": "To put an end to this war: I work in the industry, and segments of documentaries like this are artificially created to provide the audience with this kind of quality. There is no shame, no conspiracy; it's simply entertainment using all available technology to create something as beautiful as we can.\r Additionally, CGI techniques are employed to enhance or recreate certain elements that may not be easily captured during the original filming. \r To enhance the quality of certain documentary segments, various techniques are employed, including the use of 3D models and CGI combined with real footage.  Also yes, to a very, veery good eye, something off can be spotted in this documentary right here, just a feeling, and yes, it's given by the animation and the blur given to the movement artifically (not by the recording of the camera). But it doesn't mean every frame of this video is artificially made. Also something off can be felt when they polish the image of the recording, clearing as much as possible the figure of the animal, to be better seen. Also taking away a lot of thing that may have been in front of the camera (like more foliage and sticks).", "correlation": 0.5068905491860065}, {"start": 76, "text": "Half of the clips you see are CGI (mainly the action shots). Because the real photos were taken at a zoo. And the \"jungle\" looking environment shots featuring rivers and shit are faked through CGI. You don't have running rivers like that in a zoo. Why did they animate it? To make it look like a team of photographers actually went out in the real wild to capture rare film of this rare animal. But in reality it's much cheaper to just take a few closeup shots from an enclosure at a zoo, then top it off with some CGI action shots, than paying a full camera team to spend two weeks in the deep jungle in search for a very small, very timid and very rare animal. Besides, it probably prey in the dark, so footage would be in Infra Red not to scare the cat away = Bad shots for a documentary featuring incredible cats. But I've got to admit, the CGI and animations are very high end, and very convincing. I'd say 90% of everyone looking at this video won't notice it's CGI. And only people in the business, or people who watches a lot of CGI, can actually see it.", "correlation": 0.5041549206064864}, {"start": 76, "text": "I think some parts are CGI. Some of that footage would just be nearly impossible to get. They must have mixed real footage with CGI bits. For instance 00:51 through 01:16 looks like 3D animation to me, other bits as well", "correlation": 0.49463395317351955}, {"start": 76, "text": "Aaand I'm back in the endless loop of animal videos", "correlation": 0.49204307871100317}, {"start": 76, "text": "hi it’s...not animated. This is a real animal and this is from a nature documentary. Lol", "correlation": 0.4907179515217249}, {"start": 78, "text": "1:18 YEP it’s a cat", "correlation": 0.6434983645753256}, {"start": 78, "text": "It’s so crazy how good these videographers track this tiny animal through the forest", "correlation": 0.5989873831795749}, {"start": 78, "text": "even if it can get them into trouble...       MEOWWWWWWW", "correlation": 0.5569016718256827}, {"start": 78, "text": "how is these videos filmed? why dont the animals run away?", "correlation": 0.5388424988956559}, {"start": 78, "text": "“Even when it can get them into trouble.”   ᴍᴇᴏᴡ", "correlation": 0.5350933746268138}, {"start": 78, "text": "Even if it can get them in trouble * hurt cat noise *", "correlation": 0.5346521253971506}, {"start": 78, "text": "They cut the video when the cameraman petting the wild beast", "correlation": 0.5280228528965024}, {"start": 78, "text": "Most of the time, videos of small animals like this are filmed in an enclosed area, almost like a zoo. Then it is edited to look like its in real wildlife.", "correlation": 0.5268221235748114}, {"start": 78, "text": "How do you guys get this footage without disturbing or scaring the animal", "correlation": 0.5190283930804569}, {"start": 78, "text": "At 1:18 I saw the branch move and just nonononoNONONO BABY", "correlation": 0.5080995741058805}, {"start": 78, "text": "what is the name of this animal? the dont tell it in video or description: downvote.", "correlation": 0.5076829197377984}, {"start": 78, "text": "All of these nature videos lose all meaning once you realize the whole thing is staged and the animals are in fact being forced into a narrative. Not saying the \"information\" is wrong, or a lie, but the whole video aspect is simply a story they weave together to keep your attention.", "correlation": 0.49806008529124324}, {"start": 78, "text": "THESE WILD ANIMALS ARE TERRIFYING ! ! ! CHILDREN SHOULD NOT WATCH SUCH VIDEOS ! ! !", "correlation": 0.49603021604996145}, {"start": 78, "text": "I've been watching Nat Geo/BBC since I was a child and it just occurred to me that they capture these crazy-ass shots without being \"seen\"/detected by the animals. Also, part of me feels as though foley artist go in after the video has been filmed and create sound effects. Everything sounds a bit too crisp to be from the portrayed source.", "correlation": 0.4934759115491019}, {"start": 78, "text": "I always wonder how they film all of this without making the animal scared or aware of them being there", "correlation": 0.48859431702349904}, {"start": 78, "text": "World's cutest animal documentary.", "correlation": 0.48647314830330673}, {"start": 78, "text": "Its a wild animal.", "correlation": 0.48457412586075443}, {"start": 78, "text": "“Even if it can get them into trouble”  “MEEEOWWWW”", "correlation": 0.4843877873141374}, {"start": 78, "text": "First video of bbc where i dont see animal eating each other", "correlation": 0.48058954823794203}, {"start": 78, "text": "Am I the only one who always gets fascinated by how they get this good footage and follow the animal around lol", "correlation": 0.47917399787178144}, {"start": 79, "text": "1:19 don’t say that. I honestly thought some predator was gonna come and eat it or something", "correlation": 0.5406940820329779}, {"start": 79, "text": "1:19 Even if it can get into trouble Baby Kitten falls off a stick meow🥺😍🩷", "correlation": 0.5006312010056129}, {"start": 79, "text": "That meow... 1:19", "correlation": 0.485314794406255}, {"start": 80, "text": "1:20   Tree: breaks Cat: DRAMATIC MEW", "correlation": 0.5754398869462285}, {"start": 80, "text": "1:20 The cameraman is like \"Aaaawwwwwww cute c:\"", "correlation": 0.5170438439654048}, {"start": 80, "text": "1:20 he fell with a wee meow 🥰 🥺", "correlation": 0.502019485947555}, {"start": 80, "text": "1:20: Cat falls and mews  Me: Dies", "correlation": 0.47469372059870973}, {"start": 80, "text": "1:20 That was like something out of a cartoon.", "correlati ght away, he puts his super paces through their senses.", "correlation": 0.6671873350738852}, {"start": 88, "text": "\"Straight away he puts his super senses through their paces\" Act cute", "correlation": 0.5680292919025116}, {"start": 88, "text": "“Straight away he puts his super senses through their paces”  continues to sneak up on leaf", "correlation": 0.5611289180096111}, {"start": 88, "text": "\"Straight away, he puts his super senses through their paces\" doesn't even notice camera crew trailing him", "correlation": 0.550517839029941}, {"start": 88, "text": "\"Straight away he puts his super senses through their paces\". Meanwhile the cameraman two meters away completely undetected: \"I am stealth incarnate\".", "correlation": 0.5207194715113055}, {"start": 88, "text": "He uses his super senses.. to hunt a fly. Tough boy", "correlation": 0.5191460679016271}, {"start": 88, "text": "\"straight away he puts his super senses through their paces\"  Big eyes on smol boy", "correlation": 0.5110163885286924}, {"start": 88, "text": "Narrator: Straight away he puts his super sensors into action Bitty kitty: Super sensors activate!", "correlation": 0.5064053318414677}, {"start": 88, "text": "\"Straight away, he puts his super senses through their paces\" ..the unwitting ant stands no chance.", "correlation": 0.48684832021870306}, {"start": 88, "text": "\"he has super senses\",  he can even knew if he tailed by cameraman whole time", "correlation": 0.4761979153788069}, {"start": 88, "text": "Hi! I am from Manipur, India. I don't know the meaning of - \"straight away he puts his super senses through their paces\".  Could you please elaborate?", "correlation": 0.46800756145866856}, {"start": 88, "text": "Me seeing this wild animal: I know I shouldn't but...", "correlation": 0.46789463981605195}, {"start": 88, "text": "If the animal is so slick, how can you catch a glimpse? We want to see the animals that are too smart to be seen.", "correlation": 0.46765567204093356}, {"st     if(!Array.isArray(danmakuComments)){

    // ===== 요소 참조 / 전역 상태 =====
    var video = null;
    var videoContainer = null;
    var playPauseBtn = null, playIcon = null, pauseIcon = null;
    var progressContainer = null, progressBar = null;
    var timeDisplay = null;

    var isDragging = false;          // 진행바 드래그
    var activeDanmaku = new Map();   // idx -> { element, currentX, width, y, speed }
    var animationId = null;
    var isPaused = false;            // 비디오 정지 동기화
    var lastRafTime = 0;             // requestAnimationFrame 시간
    var lastVideoTime = 0;           // 직전 timeupdate의 비디오 시간 (시킹 대비)
    
    // 댓글별 고유 속도 계산 함수 (픽셀 단위로 네 개 중 하나)
    function getDanmakuSpeed(commentText) {
      const textHash = hashString(commentText || '');
      const speedOptions = [-140, -180, -220, -260]; // px/s (음수=왼쪽)
      return speedOptions[textHash % speedOptions.length];
    }

    document.addEventListener('DOMContentLoaded', function(){
      video = document.getElementById('video-player');
      videoContainer = document.getElementById('video-container');
      playPauseBtn = document.getElementById('play-pause-btn');
      playIcon = document.getElementById('play-icon');
      pauseIcon = document.getElementById('pause-icon');
      progressContainer = document.getElementById('progress-container');
      progressBar = document.getElementById('progress-bar');
      timeDisplay = document.getElementById('time-display');

      // start 기준 정렬
      danmakuComments.sort((a,b) => a.start - b.start);

      // 이벤트 바인딩
      video.addEventListener('timeupdate', onTimeUpdate);
      video.addEventListener('loadedmetadata', updateTimeDisplay);
      video.addEventListener('play', () => { updatePlayPauseButton(); lastVideoTime = video.currentTime || 0; resumeAllDanmaku(); });
      video.addEventListener('pause', () => { updatePlayPauseButton(); pauseAllDanmaku(); });
      video.addEventListener('seeking', resetDanmakuForSeek);

      playPauseBtn.addEventListener('click', togglePlayPause);
      progressContainer.addEventListener('mousedown', startDrag);
      document.addEventListener('mousemove', doDrag);
      document.addEventListener('mouseup', endDrag);
      progressContainer.addEventListener('click', (e)=>{ if(!isDragging) seekVideo(e); });

      // 리사이즈 시 현재 떠있는 단무쿠 위치/퇴장 판정 보정
      window.addEventListener('resize', () => {
        // 큰 레이아웃 변화에서는 간단히 리셋
        resetDanmakuForSeek();
      });

      // 초기 상태
      updatePlayPauseButton();
    });

    function togglePlayPause(){ if(video.paused) video.play(); else video.pause(); }

    function updatePlayPauseButton(){
      if(!video) return;
      if(video.paused){
        playIcon.style.display='block';
        pauseIcon.style.display='none';
      } else {
        playIcon.style.display='none';
        pauseIcon.style.display='block';
      }
    }

    function updateTimeDisplay(){
      if(!video || !video.duration) return;
      const cur = formatTime(video.currentTime || 0);
      const tot = formatTime(video.duration);
      timeDisplay.textContent = cur + ' / ' + tot;
    }

    function onTimeUpdate(){
      if(!video) return;
      const t = video.currentTime || 0;

      // 진행바
      if(video.duration){
        progressBar.style.width = ((t / video.duration) * 100) + '%';
      }
      updateTimeDisplay();

      // 직전 프레임 ~ 현재 사이에 start가 들어온 댓글만 트리거
      danmakuComments.forEach(function(cmt, idx){
        if(cmt.start > lastVideoTime && cmt.start <= t && !activeDanmaku.has(idx)){
          const delay = Math.random() * 200; // 0~200ms (원하면 제거)
          setTimeout(() => addDanmakuComment(cmt, idx), delay);
          if (!animationId) startAnimationLoop();
        }
      });

      lastVideoTime = t;
    }

    // ===== 진행바 제어 =====
    function startDrag(e){ isDragging = true; e.preventDefault(); updateVideoTime(e); }
    function doDrag(e){ if(!isDragging) return; e.preventDefault(); updateVideoTime(e); }
    function endDrag(){ if(!isDragging) return; isDragging = false; }
    function seekVideo(e){ updateVideoTime(e); }

    function updateVideoTime(e){
      const rect = progressContainer.getBoundingClientRect();
      const pos = clamp((e.clientX - rect.left)/rect.width, 0, 1);
      if (video.duration) {
        video.currentTime = pos * video.duration;
        // 시킹 처리: 떠있는 단무쿠 초기화 & 타임 마커 갱신
        resetDanmakuForSeek();
      }
    }

    // ===== 단무쿠 생성 / 애니메이션 =====
    function addDanmakuComment(cmt, idx){
      const div = document.createElement('div');
      div.className = 'danmaku-comment';
      div.id = 'danmaku-' + idx;

      const txt = (cmt.text ?? '') + '';
      div.innerHTML = '<div class="comment-text"></div>';
      div.querySelector('.comment-text').textContent = txt; // XSS 안전

      // 세로 위치: 댓글 텍스트 기반 결정적 위치 (하단 여백 10px)
      const containerRect = videoContainer.getBoundingClientRect();
      // 댓글 텍스트를 해시값으로 변환하여 일관된 위치 생성
      const textHash = hashString(cmt.text || '');
      const maxHeight = containerRect.height - 20; // 하단 10px 여백
      const randomY = textHash % maxHeight; // 상단부터 시작

      // 먼저 붙여서 실제 너비를 잰다
      div.style.top = randomY + 'px';
      div.style.left = '0px';
      div.style.transform = 'translateX(0px)';
      div.style.transition = 'none';
      videoContainer.appendChild(div);

      const elWidth = div.getBoundingClientRect().width;

      // 시작 X: 컨테이너 오른쪽 바깥
      const startX = containerRect.width; // +10 버퍼
      div.style.transform = `translateX(${startX}px)`;

      // 댓글별 고유 속도 계산
      const danmakuSpeed = getDanmakuSpeed(cmt.text);

      // 상태 저장
      activeDanmaku.set(idx, {
        element: div,
        currentX: startX,
        width: elWidth,
        y: randomY,
        speed: danmakuSpeed
      });

      // 애니메이션 루프 가동
      if (!animationId) startAnimationLoop();
    }

    function startAnimationLoop() {
      function animate(ts) {
        if (!lastRafTime) lastRafTime = ts;
        const deltaTime = (ts - lastRafTime) / 1000; // 초
        lastRafTime = ts;

        if (!isPaused) {
          updateDanmakuPositions(deltaTime);
        }

        // 루프 유지: 활성 단무쿠가 없고 비디오도 일시정지면 멈출 수 있음
        if (activeDanmaku.size === 0 && video?.paused) {
          animationId = null;
          lastRafTime = 0;
          return; // 루프 종료
        }
        animationId = requestAnimationFrame(animate);
      }
      if (!animationId) animationId = requestAnimationFrame(animate);
    }

    function updateDanmakuPositions(deltaTime) {
      // 각 댓글별 고유 속도로 왼쪽 이동
      activeDanmaku.forEach((danmaku, idx) => {
        if (!danmaku || !danmaku.element) return;
        danmaku.currentX += danmaku.speed * deltaTime;

        // 완전 퇴장: 요소의 오른쪽 끝이 화면 왼쪽 밖으로 나가면 제거
        if (danmaku.currentX + danmaku.width < 0) {
          danmaku.element.parentNode?.removeChild(danmaku.element);
          activeDanmaku.delete(idx);
        } else {
          danmaku.element.style.transform = `translateX(${danmaku.currentX}px)`;
        }
      });
    }

    // ===== 시킹/재생 동기화 =====
    function pauseAllDanmaku() { isPaused = true; }
    function resumeAllDanmaku() { isPaused = false; if (!animationId) startAnimationLoop(); }

    function resetDanmakuForSeek(){
      // 떠있던 것들 제거
      activeDanmaku.forEach((d)=>{ d.element?.parentNode?.removeChild(d.element); });
      activeDanmaku.clear();
      // 다음 프레임 기준으로 새로 트리거
      lastVideoTime = video?.currentTime || 0;
      // 애니메이션 타임라인 초기화
      lastRafTime = 0;
    }
  </script>
</body>
