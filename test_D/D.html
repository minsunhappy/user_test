{"start": 31, "text": "“He’ll soon be setting off on a solitary life...”    I’ve already prepped his home, food, toys so he won’t be lonely at all.", "correlation": 0.5139275469513513}, {"start": 31, "text": "Narrator: he'll soon be setting off on a solitary life, fending entirely for him self  Me:no! that's not fair🥺💔", "correlation": 0.5136274719260011}, {"start": 32, "text": "0:32 not a real cat, it didn’t instinctively chase the fly.", "correlation": 0.6169066086563572}, {"start": 34, "text": "It's a cat or kitten !!! Video was filmed in Amazon Forest", "correlation": 0.6178242428681813}, {"start": 34, "text": "Im quiet curious about how they filmed the cat.  Thinking they may have scented a food scent all over those areas from pond to pond to the tree branch to get it walk around and follow the scent to capture it as it moves.  Still, ingenious thinkin, planning & beautiful filmjng eitherway as always.", "correlation": 0.5814539748256308}, {"start": 34, "text": "video: *intense music plays 'lil cat: *falls of twig", "correlation": 0.5768386017937749}, {"start": 34, "text": "plot twist: they just let out a poor kitten in the forest to film it", "correlation": 0.566886850519156}, {"start": 34, "text": "i feel like whoever was following it probably has a bunch of footage of the cat looking scared as shit just trying to find shelter.. idk he looks deliberately placed in the woods like he's never been outside before it's weird", "correlation": 0.5637665181741848}, {"start": 34, "text": "it's like someone put a kitten in a Forrest and recorded it haha", "correlation": 0.5595998235241834}, {"start": 34, "text": "0:34 how can they be predators", "correlation": 0.5584295675632128}, {"start": 34, "text": "Well think that is cgi. cuz the cat fall from twigs", "correlation": 0.5533559949765755}, {"start": 34, "text": "@Squid1nkyy  As an animator, I can pretty much guarantee that this is not CGI. The reason the motion feels \"too fluid\" is because we're used to seeing cats at larger scales, so the cat in the video doesn't have the vibrations that we would expect due to the weight of a larger animal. Likewise, the waxy leaves in the rainforest may diffuse light in a way that looks strange to someone unfamiliar with that environment. In the specific shots you mentioned, look at the way the light penetrates the cat's skin but not the underlying bone, the way the little sprouts and leaves move as the cat jumps over the big leaf, the way the cat's fur clumps as it touches the water, etc., etc., — these are the kinds of things a VFX team would be unlikely to include, especially on any kind of deadline.  Also — yes, the BBC has money, but they're still nowhere close to a Hollywood movie studio.  They simply don't have the manpower or budget to throw at cutting-edge VFX for random shots in a cat documentary. Look at the effects in Dr. Who for comparison — they're good, but nowhere close to photorealistic. What you're describing would be at the level of  Avatar: The Way of Water or better.", "correlation": 0.5445959377001122}, {"start": 34, "text": "That was a damn house kitten. The BBC is running out of animals to film. Now they're throwing their house pets into the local park and filming them close up.", "correlation": 0.5200412651133139}, {"start": 34, "text": "@munkimoto2294  it looks like someone green screened a house cat into some jungle floor footage.", "correlation": 0.5178309898915191}, {"start": 34, "text": "i watched this on an airline and when the cat first peeked out from behind a leaf i just straight up broke down crying", "correlation": 0.5166925234576086}, {"start": 34, "text": "The camera is so good that This looks like it was CGI with some close ups of a real kitten. Does anyone else think this looks fake? Especially when it jumps over the leaf", "correlation": 0.5078814878687883}, {"start": 34, "text": "Why do I feel someone just took their kitty into the nearest forest to film a documentary?", "correlation": 0.503205081494008}, {"start": 34, "text": "\"Hey Jeremy?\" Yeah? \"Where's that super rare cat you guys found?\" Yeeeeah, sorry about that. I was actually filming my cat in my back yard instead of filming that one... \"...Fuck it. Photoshop some trees in and call it a day.\" 😂😂😂", "correlation": 0.49866434559742806}, {"start": 34, "text": "@succulent951  Yes it is, you can clearly see it at the part where the cat jumps over the leaf. It looks too slow and fluid to be real.", "correlation": 0.49012586870388664}, {"start": 34, "text": "They just put a kitten in the forest and filmed it, you can't fool me BBC", "correlation": 0.489906637660346}, {"start": 34, "text": "@jackyzboub5607  \"cgi is quite easy\"? Bro you need to watch Corridor Crew, there is no button to make good CGI, it takes days, weeks and months of hard work. You don't just \"make a cgi cat appear\", you have to model the cat, which looking at how good this looks would take a long time, you would have to run physics simulations on the hair, they would also either have to make the water and leaf cgi as they interact with the cat, or they would have to have a real thing on set and digitally erase it out of every scene and replace it with a cat (a job that would require hours of painstaking manual erasure and replacement). You would also have to simulate the shadows to be captured realistically on the ground. At this point with all the replacing you'd need to do it would make more sense to make the whole video 100% cg and just use real footage as a reference for creating a digital environment, but that would still take a long time because of how good the environment looks and you'd still have to do a lot of work to make sure nothing clips and all the shadows look realistic on the textures. If it's so easy to find footage like that then go recreate this video for me, go find an animated model of a cat, throw it into a digitally recreated forest and tell me how good it looks, maybe then you'll realize that good looking cgi takes a lot of work, and it's not just putting a model into an environment and letting the magic cgi button do the rest.  I'm not saying this video isn't cgi, part of it probably is, but it most likely took way more work than you seem to think it did", "correlation": 0.4898303255879693}, {"start": 34, "text": "Producers: Aight y’all, for this vid, we’re going to throw a kitten into the jungle and use expensive cameras to follow it. Sound good?", "correlation": 0.4792567046736973}, {"start": 34, "text": "25 million views.  Of a cat, walking approx 40 feet through the woods. Doing dothing.", "correlation": 0.46201195871676404}, {"start": 35, "text": "Looks like someone put their kitten in the back yard and started filming", "correlation": 0.6184100670894193}, {"start": 35, "text": "This looks like they took a kitten and threw it in the forest to film it.", "correlation": 0.6147951375693916}, {"start": 35, "text": "Why does this feel like some guy took his kitten into the forest and started filming it.", "correlation": 0.6135676382139541}, {"start": 35, "text": "Anyone else notice they used a little red light to make the cat follow it at 0:35 ?", "correlation": 0.5717927317971898}, {"start": 35, "text": "0:35 apex predator", "correlation": 0.5703394036864521}, {"start": 35, "text": "I wonder how much of this is set up. Are the leaves placed there to make the cat look smaller. Is it just another fake session like the Polar Bear den footage, or the fake tree houses of native peoples that have been exposed. I struggle to believe BBC footage these days because they have been caught out in so many cheats.", "correlation": 0.5680272337047952}, {"start": 35, "text": "I in no way could restrain myself to film this... Me: (takes one look) \"KITTY!!\" stomps across marshland, likely falling on my ass because of leaves, and tears through the underbrush to grab said kitty", "correlation": 0.5671569701108317}, {"start": 35, "text": "Almost positive this is just someone’s kitten that BBC borrowed for 20 minutes just to film him walking through the forest acting like a jack ass", "correlation": 0.5589503076767304}, {"start": 35, "text": "“Fending entirely for himself” Me: HE CANT HES SMALLER THAN A LEAF", "correlation": 0.5312940312703832}, {"start": 35, "text": "Wtf. How have we NEVER heard of this before. They probably just filmed a kitten cheetah or whatever that was on its own. 🙄", "correlation": 0.5258047758811876}, {"start": 35, "text": "I feel like some British guy put his kitten in a jungle while touring the area and recorded him struggling to live.", "correlation": 0.5246491261540736}, {"start": 35, "text": "\"fending entirely for himself\" NOT IF I HAVE ANYTHING TO SAY ABOUT IT", "correlation": 0.5228585585526438}, {"start": 35, "text": "imagine that they doped up a kitten somewhere in the world, flying it around the globe to play in a 'nature' documentary. But yes I do have to agree, good footage.", "correlation": 0.519477673995731}, {"start": 35, "text": "\"fending for himself\" he will be fine, predators are gonna protect him", "correlation": 0.5087106498621508}, {"start": 35, "text": "Some dude just filmed his 4 month old kitten in his yard and sold it to the BBC.", "correlation": 0.5082887800480035}, {"start": 35, "text": "So someone took a kitten and bought a camera and filmed it in their backyard. You almost had me bbc lol", "correlation": 0.5082327530946394}, {"start": 35, "text": "I'm pretty sure they were lacking material and straight up started filming a random kitten alone in the forest", "correlation": 0.5071803645663104}, {"start": 35, "text": "0:35 looks like CGI", "correlation": 0.5049369895566123}, {"start": 35, "text": "“ Fending entirely for himself” me: Y O U  H A V E  T H E  R I G H T  T O  R E M A I N  S I L E N T ! ! !", "correlation": 0.4981398388100255}, {"start": 35, "text": "I was looking at the thumbnail and I thought “they must be trying to get views” then I saw the  actual organism wandering about in leaves  and realized this channel doesn’t play around.", "correlation": 0.49159175262635624}, {"start": 37, "text": "I love how the kitty is only half the size of that leaf! 0:37", "correlation": 0.7413230663403564}, {"start": 39, "text": "It looks like they purposely dropped some unusually large leaves on the ground to misrepresent the size of the animal", "correlation": 0.5074633646744443}, {"start": 39, "text": "It crawls over leaves", "correlation": 0.5007384576889302}, {"start": 39, "text": "It's movements are so smooth omg, like it went over that leaf barely touching it", "correlation": 0.4775712104275291}, {"start": 39, "text": "It had to jump over a leaf oh Lord.", "correlation": 0.44064194094656883}, {"start": 39, "text": "Steps on something.  Oops hopefully that was a leaf", "correlation": 0.43061695014234797}, {"start": 39, "text": "When it passed by the leaf, I cried 🥺😳", "correlation": 0.4161733738281947}, {"start": 39, "text": "How is it the size of a leaf???😓😓😓😓😲😲😲", "correlation": 0.40706474385416286}, {"start": 39, "text": "Fun fact it was a big leaf", "correlation": 0.40556676435917205}, {"start": 40, "text": "0:40 Either those leaves are as big as cars, or the cat is as small as they said it is.", "correlation": 0.6357976199532767}, {"start": 40, "text": "0:40  He looks up to a leaf", "correlation": 0.619090478471385}, {"start": 40, "text": "0:40 cat leaps over leaf thinking its poison", "correlation": 0.6187380607459085}, {"start": 40, "text": "0:40 its so cute how he went over the leaf instead of just stepping on it", "correlation": 0.5791985941071424}, {"start": 40, "text": "0:40 the fact he has to climb over a leaf is just so cute XD  Edit: Nothing anymore, read the comments to see a beeg arguement. (@jurassicfreak2579 forced me to change this in the most brutally mean way possible btw)", "correlation": 0.5729263309478145}, {"start": 40, "text": "BBC \"He's going to have to fend for himself\"  Little baby Kitty jumps over leaf 0:40", "correlation": 0.5404355510139115}, {"start": 40, "text": "0:40 My boy had to jump over a leaf. A LEAF.", "correlation": 0.5011190704934214}, {"start": 41, "text": "Chara LV18 and at 0:41 there are little droplets of water on the leaf. Also, there's still some green on some of the leaves and it could have something to do with the kind of tree it came from.", "correlation": 0.5607505414504421}, {"start": 41, "text": "0:41 He jumps over the leaf. That's strangely cute.", "correlation": 0.5586306369233982}, {"start": 41, "text": "Why isn’t anyone talking about how, at 0:41,   smol cat was SO CAREFUL to not hurt the leaf?", "correlation": 0.5076383208839421}, {"start": 41, "text": "0:41 to give you an idea of how small he actually is, this boi had to jump over a leaf there.", "correlation": 0.5040370743115762}, {"start": 41, "text": "He's like a mini ninja...watch how he crosses the leaf @0:41 ...a domestic cat wouldn't cross it with both front paws in the air.", "correlation": 0.499939112665315}, {"start": 41, "text": "0:41 OMIGOSH HES THE SAME SIZE OF THAT LEAF,,,", "correlation": 0.4247005235521474}, {"start": 42, "text": "0:42 the way he avoided the leaf", "correlation": 0.5743492896631}, {"start": 42, "text": "@theOneandOnly-u9w 0:42 jumping over the leaf is a big give away also the whole water bit after too", "correlation": 0.5258269289844061}, {"start": 42, "text": "That’s exactly what I was thinking when I saw 0:42, when the leaf doesn’t move at all and 0:52, which has a clearly edited shadow.", "correlation": 0.5066434789059799}, {"start": 42, "text": "0:42 wow. It walks OVER the leaf😂", "correlation": 0.49548869176916077}, {"start": 44, "text": "I’m here wondering how they follow and film it in the forest from every damn angle!!!", "correlation": 0.5671534404250579}, {"start": 44, "text": "It looks like it's filmed on a set or enclosed area. if you look at the landscape features, they are placed almost perfectly and sculpted to look cinematic. and the almost perfect looking placement and movement of camera/angles, there is a chance that its filmed over a long time and stitched to convey a story or narrative, or they just have cameras rigged in the enclosure that are remotely controlled. A lot of wildlife documentaries do this.", "correlation": 0.5597021329747937}, {"start": 44, "text": "Omg the camera quality's so good, the feline looks like cgi in 0:41-0:44 to me", "correlation": 0.5435203999388137}, {"start": 44, "text": "0:44 this looks animated or cgi", "correlation": 0.539220671151267}, {"start": 44, "text": "I'm only thinking this is not real bc the forest looks too perfectly organized         But I like the video its cute", "correlation": 0.5384509330368382}, {"start": 44, "text": "A lot of times these videos aren’t actually in the wild. They use animals they have at sanctuaries and set up backgrounds to make it look like they’re in the jungle. There’s a documentary about it and it was fascinating", "correlation": 0.5164106030818034}, {"start": 44, "text": "@uncletony6210  You might want to watch the BBC wild life series with Attenborough that go through exactly how they achieve the shots at the end of each episode. It's incredible the lengths they go to and how much planning/waiting goes into it.", "correlation": 0.5066727951442487}, {"start": 44, "text": "​ @Squid1nkyy  only the part where it jumps over the leaf looks unnatural. But you can't prove it's CGI. Idk what you on about when you say the entire forest is fake though", "correlation": 0.47093516569399085}, {"start": 44, "text": "@ToaAntan  it doesn’t look cgi at all. Most nature photographers spend a lot of time outside waiting for the right footage to appear.", "correlation": 0.449482295505056}, {"start": 44, "text": "The reason why this looks like CGI is because it's filmed in ultra HD, the BBC has started doing this years ago. It makes more details visible than you'd see with your own eyes if you were to see this in real life. Also, some shots aren't played at normal speed. You can see the jump over the stream is slowed down just a bit for example, but what you see is very much real and very much happened in front of the crew. Also, take into acount the added sound effects. No offense, but it bothers me a lot that some people nowadays can't see the difference anymore between real-life and CGI.  Especially in nature documentaries with obviously filmed shots shown with behind the scenes footage that's released with every aired documentary where you can see how the shots were made.", "correlation": 0.44909229818236546}, {"start": 44, "text": "I think they set cameras in the wild to keep track of nature without scaring away animals and stuff", "correlation": 0.44754656560804174}, {"start": 44, "text": "To me it seems like an animated and made up kind of video. Anyone can detect that special effects, or may be the photography is next level.", "correlation": 0.4292264081551199}, {"start": 44, "text": "@HorribleSmileProductions  I don’t doubt it. In my opinion it doesn’t look like cgi. Some shots, like the one with the big tree does look odd, but it could be how it was filmed or edited.", "correlation": 0.42818813163717334}, {"start": 44, "text": "I truly wish someone to explain how they shoot those videos! I mean what kind of wizard cameraman doing all this work ! I wanna shake his /her hand 🤔", "correlation": 0.4277251620726733}, {"start": 44, "text": "How do they film this?", "correlation": 0.4237944884602721}, {"start": 44, "text": "I want to know one thing that how these shots are shot they look amazing . I love these types of videos", "correlation": 0.4223625051050665}, {"start": 44, "text": "How the hell do they capture this footage?! Amazing", "correlation": 0.40962037792827877}, {"start": 44, "text": "@MohamedDoha  have you ever heard of work? yeah the ones who took these footages are professionals in their field. they will camp in these jungles for days, some of them would even do it for months", "correlation": 0.4093652519113909}, {"start": 44, "text": "This is amazingly cute and how did they film this", "correlation": 0.40794060453648867}, {"start": 44, "text": "I want it to be real, but I thought the same thing it seems like it would b more well known... i thought maybe they just filmed it next to really big leaves or something. It looks about as big as a squirrel", "correlation": 0.4071310168233935}, {"start": 45, "text": "0:45 perfect tree roots", "correlation": 0.8107190687378971}, {"start": 45, "text": "0:45 What he lacks in size... he make up for by being so CUUUUUUUUUUUUUUUUUTE.", "correlation": 0.6204306715957699}, {"start": 45, "text": "\"What he lacks in size.......\"  ....he doesn't make up anywhere else really.", "correlation": 0.5939427339062637}, {"start": 45, "text": "This is fake with CGI . cuz it shows him being as small as leaves  but then at 0:45 and compare him to the tree's trunk. and all the leaves on the ground.  that cat cant fit on the palm of your hand.", "correlation": 0.5900605784456652}, {"start": 45, "text": "0:45 No it is actually  What he lacks in size he makes up for cuteness. Where can I get one of these?", "correlation": 0.5825020239050438}, {"start": 45, "text": "\"What he lacks in size...\" write that down, write that down!", "correlation": 0.5708584810495891}, {"start": 45, "text": "What he lacks in size , he makes up for in smallness", "correlation": 0.5673381359440841}, {"start": 45, "text": "“what he lacks in size” lmao", "correlation": 0.5668043526815147}, {"start": 45, "text": "0:45  BBC Guy: He lacks in size  Me: That makes him 100 times better!", "correlation": 0.5665269855559943}, {"start": 45, "text": "What he lacks in size he makes up for         That’s what she said", "correlation": 0.5518118700197631}, {"start": 45, "text": "He walks by multiple leaves in this video, jumps over one, and climbs two branches", "correlation": 0.5435033142677201}, {"start": 45, "text": "Do people even have a clue how \"nature\" videos are made? There is more lighting and audio production and RETAKES than you could imagine, even within this less than 2 minute clip.", "correlation": 0.5416050152146749}, {"start": 45, "text": "This video needs to be longer, we only got to see how small it was compared to the tree but we don’t know if the tree is huge or small.", "correlation": 0.5404190227821827}, {"start": 45, "text": "0:45 \"what he lacks in size he makes up for in daring\" puts one paw in the river and retreats", "correlation": 0.5394814563612877}, {"start": 45, "text": "In what he lacks in size, he makes up for 🙈🙈🙈", "correlation": 0.5388258289330148}, {"start": 45, "text": "What he lack in size.....oh who am I kidding, this thing is adorable!", "correlation": 0.534888777656755}, {"start": 45, "text": "This was all filmed inside a square box with a forest in it.", "correlation": 0.5302900039956625}, {"start": 45, "text": "What he lacks in size, he makeup for in daring", "correlation": 0.5266927582424307}, {"start": 45, "text": "Okay so why does 0:40-0:45 look Cgi lol", "correlation": 0.5220216076394909}, {"start": 45, "text": "What he lacks in size.... he makes up for...... in BALLS!", "correlation": 0.5208261487739879}, {"start": 46, "text": "@СашаЛобанов-я8в  0:46 it is a tree,not a big tree i know. pls look how big is this little citty, and in the jungle theere givs realy big leaves ;) it is only a little fake^^ filter 4 cameras ;)", "correlation": 0.6956615303296841}, {"start": 46, "text": "0:46 \"What he lacks in size, He makes up for ..... in daring.\" 💪", "correlation": 0.6144265895094367}, {"start": 46, "text": "0:46 Welcome to Jurassic Park!", "correlation": 0.5098379895685486}, {"start": 48, "text": "It’s hard to get through my head that there’s a camera man in the forest", "correlation": 0.5710720165936665}, {"start": 48, "text": "Kinda feels like this was filmed not in a forest, but in a zoo or smth", "correlation": 0.5710063353660586}, {"start": 48, "text": "I’d like to think it’s because the cameraman was so perfectly disguised as a tree", "correlation": 0.5270648042134898}, {"start": 48, "text": "@holliswilliams8426  this was filmed in a zoo, my ignorant friend. You remember the chainsaw noise bird? that was in a zoo too. They used that bird as a message, to say \"deforestation is so close to this poor birds home\" to make you emotional. When really, it heard chainsaws because its in a zoo. Youd never ever capture a wild one making chainsaw sounds.", "correlation": 0.5213341849772923}, {"start": 48, "text": "The forest at places did look somewhat like a set from a movie.", "correlation": 0.5156810839278797}, {"start": 48, "text": "Imagine how many cameras were set in that forest.", "correlation": 0.5134663700377998}, {"start": 48, "text": "Where is that forest ?", "correlation": 0.5104373455763153}, {"start": 48, "text": "It always amazes me to think about how we got this kind of footage of nature.", "correlation": 0.49819720884491625}, {"start": 48, "text": "This is a kitten, not a grown male. If you guys don´t believe what Mauri QHD says, then google pictures of them. You will see the difference between kitten and adult. Then the cat seems first really small, almost like only a handful, but if you see it at 0:48 and compare it to the first seconds, there is a huge difference. The leaves look extremly big, but at 0:48 they are all of a sudden way smaller then the cat. If you google the size of the cat you will see, that it is 35-48 cm big, without its tail, which is 15-30 cm long. So before judging Mauri QHD´s therorie, inform youself about the possibility like i did and not believe every shit that´s shown in a tv show. Sorry for my bad english, but i hope you get what i´m talking about.", "correlation": 0.4912094952855828}, {"start": 48, "text": "This video makes nature look too nice.", "correlation": 0.48076968041048085}, {"start": 48, "text": "Behold, the Forest Everkitten.", "correlation": 0.4793024585946479}, {"start": 48, "text": "Well its not like cameramen chase animals through the woods", "correlation": 0.4624998522077227}, {"start": 48, "text": "What is the forest name ? Cause in want one 😊", "correlation": 0.4597751418816236}, {"start": 48, "text": "@Sticks-q5i  And of course the forest would be made for this video. Or maybe for 2 or 3 other animals. Do you know how rich BBC is?", "correlation": 0.45972236975668396}, {"start": 48, "text": "I ❤️ the forest. 👍", "correlation": 0.4564193994547032}, {"start": 48, "text": "the BBC are truly the masters of filming nature scenes", "correlation": 0.4472246453130814}, {"start": 48, "text": "The forest is a paid actor", "correlation": 0.4464133924276565}, {"start": 48, "text": "next time i enter a forest: PSPSPSPSPSPSP", "correlation": 0.4434774752531154}, {"start": 48, "text": "It's like a enchanted forest", "correlation": 0.4324836582542313}, {"start": 48, "text": "they cut out the part where he made an entire tree collapse", "correlation": 0.4305922511640657}, {"start": 49, "text": "00:49 looks like VFX", "correlation": 0.5300268338743317}, {"start": 50, "text": "0:50 narrator: \"what he doesn't have in size he makes up for in daring\" smol cat: splashes water", "correlation": 0.7332313249376871}, {"start": 50, "text": "0:50 How your dog on skyrim enter the water after you go in", "correlation": 0.729915883627908}, {"start": 50, "text": "..in daring.. * crosses a stream..", "correlation": 0.6301001931631992}, {"start": 50, "text": "Cat:walks through water  Narrator: sO DaRiNg", "correlation": 0.5962283906929411}, {"start": 50, "text": "Just what I thought before the narrator said \"in daring\"", "correlation": 0.594223639339899}, {"start": 50, "text": "“He makes up in daring” Cat: touches water “INTERESTING”", "correlation": 0.5939299925695964}, {"start": 50, "text": "\"What he lacks in size he makes up for, in daring\" carefully touches water with paws", "correlation": 0.572538370894582}, {"start": 50, "text": "Daring barely walk through a stream of water", "correlation": 0.5673826693387546}, {"start": 50, "text": "the daring cat who crossed the water stream walking in it.", "correlation": 0.5650505673133628}, {"start": 50, "text": "\"what he lacks in size, he makes up in daring \"  puts paw gently in the water  Extremely daring 💕💕😩", "correlation": 0.5632886330748456}, {"start": 50, "text": "He timidly crossed a small shallow stream… gosh how daring.", "correlation": 0.5602363269981941}, {"start": 50, "text": "He makes up in daring.  swims across puddle", "correlation": 0.5498875292208028}, {"start": 50, "text": "\"daring\"...  Cat shakes the water from it's paw and walks away...", "correlation": 0.5480870203736944}, {"start": 50, "text": "\"What he lacks in size, he more than makes up for in daring\" cautiously pokes at shallow water \"Terrifying\"", "correlation": 0.5454955950076267}, {"start": 50, "text": "“What he lacks in size… He makes up for in daring.” As he paws at extremely shallow water.", "correlation": 0.54465560801987}, {"start": 50, "text": "Daring(they ain't afraid of water)", "correlation": 0.5440788949174523}, {"start": 50, "text": "And daring steps in water", "correlation": 0.5428052565355023}, {"start": 50, "text": "\"What he lacks in size he makes up for in daring\" touches water, instantly pulls paw back", "correlation": 0.5415066138492164}, {"start": 50, "text": "It touched the stream to see if it's too cold for him to swim through. Smart little cute thing.😀", "correlation": 0.5390606673318209}, {"start": 50, "text": "“What he lacks in size, he makes up for in daring.”  proceeds to gently touch water with paw", "correlation": 0.5354292378302474}, {"start": 51, "text": "0:51 \"Daring\" Touches water and backs off", "correlation": 0.7340712533330739}, {"start": 51, "text": "the title should be the cat that isnt afraid of water 0:51", "correlation": 0.5825179490196815}, {"start": 51, "text": "BaigL 0:51 This scene where the cat crosses the stream here looks incredibly CG. The fur doesn't seem to be li ung cats are born curious, which ironic.", "correlation": 0.6587083911469214}, {"start": 67, "text": "Young cats are born  curious     Hey bbc my 14 year old cat is always curious 😂", "correlation": 0.6471585162964409}, {"start": 67, "text": "\"Young cats are born curious\". There goes the saying!", "correlation": 0.6374409997958853}, {"start": 67, "text": "Old cats are born curious", "correlation": 0.633263512708486}, {"start": 67, "text": "\"Young cats are born curious\" Ehmm, all cats are born young..", "correlation": 0.632608700741122}, {"start": 67, "text": "\"Young cats are born curious.\" It's not like they lose such trait when they grow. 😐", "correlation": 0.6279957562010053}, {"start": 67, "text": "Young cats are curious...that's how they learn about the world  P A R K O U R", "correlation": 0.6248071587014907}, {"start": 67, "text": "\"Young cats are born curious\" OH NO NOT THE WORD CURIOUS", "correlation": 0.609175127022331}, {"start": 67, "text": "\"Young cats are born curious. It's how they learn about the world. Even if it gets them into trouble\"  So, just like humans", "correlation": 0.6032523173266346}, {"start": 67, "text": "\"Young cats are born curious\" ah yes, Same as humans but school teachers ducks up curiosity.", "correlation": 0.5986923500177066}, {"start": 67, "text": "cats are curious", "correlation": 0.5902194782770717}, {"start": 67, "text": "“Young cats are born curious”  Cat: oh look water YEET", "correlation": 0.5894553313878266}, {"start": 67, "text": "'Young cats are borne curious'. Not old ones?", "correlation": 0.5823818478932771}, {"start": 67, "text": "Young cats are born curious   Yeah well curiosity killed the cat..so..yeah.", "correlation": 0.5823466618620826}, {"start": 67, "text": "\"Young cats are born curious\" What about old cats, are they also born curious?", "correlation": 0.5820857245211053}, {"start": 67, "text": "\"Young cats are born curious\" Yeah and old cats are born passive🤦‍♂", "correlation": 0.5770969323304214}, {"start": 68, "text": "FAKE ALERT: 1:08 that’s just a normal sized stream but they edited fake big leaves. Still this video is the best", "correlation": 0.6515060992108597}, {"start": 69, "text": "1:09 It's true and finally confirmed. Cats don't like water 😂", "correlation": 0.5882384513893186}, {"start": 70, "text": "1:10 Contemplating what would happen if he got wet.", "correlation": 0.47407596184980993}, {"start": 71, "text": "a kid in my class showed this video to us because we are studying rainforest and it’s cute. Tbh we use iPads and we can do anything we want if it’s not too loud and the teachers don’t see AND we get rid of any evidence.", "correlation": 0.4725524349401343}, {"start": 71, "text": "Is this even real? The leaves next to that stream look too huge to be real.", "correlation": 0.46953586824483295}, {"start": 71, "text": "What is a nature video without a person with an Australian accent narrating it?", "correlation": 0.4237520838066737}, {"start": 71, "text": "1:11  Cat: you Water: relatives", "correlation": 0.4082906814806986}, {"start": 72, "text": "0:15 such a cute baby .. how can he survive in this forest 1:12 hmm guess am wrong", "correlation": 0.5803487722056668}, {"start": 73, "text": "This kitten isn't that small really,At 1:13 that river is measured 17 feet across and this tiny kitten jumped over it!!", "correlation": 0.6617142630385778}, {"start": 73, "text": "1:13 Aww, the little baby wants to jump across the river--Oh shoot he just did", "correlation": 0.6265407556589497}, {"start": 73, "text": "1:13 3rd grade me jumping over a puddle", "correlation": 0.5222395798256676}, {"start": 73, "text": "1:13 that leap is so beautiful...", "correlation": 0.4434450221952584}, {"start": 73, "text": "Most gracious jump ever 1:13", "correlation": 0.40903319499162427}, {"start": 74, "text": "0:41 smol cat is gently jumping over a leaf 🍁 1:14 smol cat is doing a big jump", "correlation": 0.5147566025113808}, {"start": 74, "text": "@d actually it is. at 1:14 when it jumps the creek, its leaves no impression in the wet sand when it landed, nor does it kick up any sand at all when it runs off.", "correlation": 0.4879045477095174}, {"start": 74, "text": "01:14, looks like a mini leopard.", "correlation": 0.41106581519453117}, {"start": 74, "text": "1:14 that jump", "correlation": 0.40525293665838547}, {"start": 76, "text": "Chaotic Fyre it's a real animal but the video itself is a mix of real footage and cgi, I'm guessing the cgi being used to show examples of what the animal can do.", "correlation": 0.631917799909997}, {"start": 76, "text": "1:16 yep just 6ft leaves beside a river that a miniature cat just crossed 😂 this is so fake", "correlation": 0.6009476718026636}, {"start": 76, "text": "@Firedrake Smolder It's mixed video footage, from a zoo topped with CGI shots. A trained eye can separate CGI animations from real movements. It's very convincing yes, but it's not impossible to see. In the zoo, most of the shots are from the cat sitting still. The river shots are obviously made using CGI because you can't fit a river like that inside a enclosure at a zoo. And it's cheaper and more convinient to make a few minutes of good CGI than actually spending weeks and weeks in a djungle trying to track down an extremely small and rare animal. Get real!", "correlation": 0.5735500276883184}, {"start": 76, "text": "Some parts of the video are CGI but some are also real footages. It is hard to capture a video or picture of these species since it is rare, small and wild. It has a strong sense so it knows when an entity is near it.", "correlation": 0.571517490534245}, {"start": 76, "text": "Doesn’t this look like the beginning of a movie? Like there’s an animal running around and a voice in the background", "correlation": 0.5715111788228898}, {"start": 76, "text": "1:16 Ye, naah after hearing this tiny little meow of pain after branch broke and he fell you aren't convincing me no more about what a predator this lil creature is :D", "correlation": 0.5612892377097335}, {"start": 76, "text": "Name of the animal please?", "correlation": 0.5600219263501287}, {"start": 76, "text": "Whats the name of the animal????", "correlation": 0.5496314099461914}, {"start": 76, "text": "This is definitely fake. Not saying the animal doesn't exist, but some of these footage isn't real. I think the film crew got a few real shots, like when it's poking its head out from behind the leaf, but the scenes of it jumping around are computer generated. It's just a really good animation. It doesn't look right. That's my theory anyway.", "correlation": 0.5432126209614092}, {"start": 76, "text": "It’s a camera that is far away  and they zoom into the animal and make it seem like the camera man is really close to the animal", "correlation": 0.5366468909070046}, {"start": 76, "text": "Why am I being shown a CGI cat walk around a forest?", "correlation": 0.5341630663910274}, {"start": 76, "text": "@thominhasss  The videography is real, even if it seems hard to believe, there are ways to obtain footage of very rare wild animals such as this. It would take significantly way more effort to animate this than record footage…", "correlation": 0.5336173248223505}, {"start": 76, "text": "Usually they put the animal  in a closed environment with lightings and cameras everywhere to take quality pictures like that. So they don't have to go to the jungle for months to find a specimen. They just ask to a zoo or an animal shelter. In that case, its unfortuately CGI. Quite impressive CGI but CGI. Btw the cat is bigger than shown in the video.", "correlation": 0.5335065376782983}, {"start": 76, "text": "@ErgonomicDesk  You are wrong. Finding a rare animal in nature is extremely long and expensive. You will NEVER find real footages that quality in a natural environment. Today, creating CGI like this is quite easy and not as expensive as paying a trip to jungle for months, with expensive cameras, etc... Here are 3 ways to realise that kind of footage : 1 - Natural footage -> extremely long, expensive and RANDOM. Even with modern technologies, most of studios releasing that kind of documentary don't even travel to take that kinf of footage, too expensive and hard. 2- Studio footage in artificial environment -> Call a Zoo or an animal shelter, find your star, put it in a 5m² room with plants, studio lighting, and cameras everywhere, film everything. You will have excellent quality footage like in this video, but with a real animal. 3 - CGI -> Take the artifical environment that you created and make a CGI cat appear, or you can create everything with CGI. Today, its easy to find footages like that.  The video is at least 50% CGI. The cat moving is full CGI. That's why the movie is so short.", "correlation": 0.5298841136533586}, {"start": 76, "text": "This was in fact animated. Nature documentaries aren't capable of capturing enough good footage of such small creatures, so they build entirely man-made sets, create fake sounds, and animate over top of it. They did a fantastic job though, it took me a bit to realize.", "correlation": 0.5219448666226185}, {"start": 76, "text": "To put an end to this war: I work in the industry, and segments of documentaries like this are artificially created to provide the audience with this kind of quality. There is no shame, no conspiracy; it's simply entertainment using all available technology to create something as beautiful as we can.\r Additionally, CGI techniques are employed to enhance or recreate certain elements that may not be easily captured during the original filming. \r To enhance the quality of certain documentary segments, various techniques are employed, including the use of 3D models and CGI combined with real footage.  Also yes, to a very, veery good eye, something off can be spotted in this documentary right here, just a feeling, and yes, it's given by the animation and the blur given to the movement artifically (not by the recording of the camera). But it doesn't mean every frame of this video is artificially made. Also something off can be felt when they polish the image of the recording, clearing as much as possible the figure of the animal, to be better seen. Also taking away a lot of thing that may have been in front of the camera (like more foliage and sticks).", "correlation": 0.5068905491860065}, {"start": 76, "text": "Half of the clips you see are CGI (mainly the action shots). Because the real photos were taken at a zoo. And the \"jungle\" looking environment shots featuring rivers and shit are faked through CGI. You don't have running rivers like that in a zoo. Why did they animate it? To make it look like a team of photographers actually went out in the real wild to capture rare film of this rare animal. But in reality it's much cheaper to just take a few closeup shots from an enclosure at a zoo, then top it off with some CGI action shots, than paying a full camera team to spend two weeks in the deep jungle in search for a very small, very timid and very rare animal. Besides, it probably prey in the dark, so footage would be in Infra Red not to scare the cat away = Bad shots for a documentary featuring incredible cats. But I've got to admit, the CGI and animations are very high end, and very convincing. I'd say 90% of everyone looking at this video won't notice it's CGI. And only people in the business, or people who watches a lot of CGI, can actually see it.", "correlation": 0.5041549206064864}, {"start": 76, "text": "I think some parts are CGI. Some of that footage would just be nearly impossible to get. They must have mixed real footage with CGI bits. For instance 00:51 through 01:16 looks like 3D animation to me, other bits as well", "correlation": 0.49463395317351955}, {"start": 76, "text": "Aaand I'm back in the endless loop of animal videos", "correlation": 0.49204307871100317}, {"start": 76, "text": "hi it’s...not animated. This is a real animal and this is from a nature documentary. Lol", "correlation": 0.4907179515217249}, {"start": 78, "text": "1:18 YEP it’s a cat", "correlation": 0.6434983645753256}, {"start": 78, "text": "It’s so crazy how good these videographers track this tiny animal through the forest", "correlation": 0.5989873831795749}, {"start": 78, "text": "even if it can get them into trouble...       MEOWWWWWWW", "correlation": 0.5569016718256827}, {"start": 78, "text": "how is these videos filmed? why dont the animals run away?", "correlation": 0.5388424988956559}, {"start": 78, "text": "“Even when it can get them into trouble.”   ᴍᴇᴏᴡ", "correlation": 0.5350933746268138}, {"start": 78, "text": "Even if it can get them in trouble * hurt cat noise *", "correlation": 0.5346521253971506}, {"start": 78, "text": "They cut the video when the cameraman petting the wild beast", "correlation": 0.5280228528965024}, {"start": 78, "text": "Most of the time, videos of small animals like this are filmed in an enclosed area, almost like a zoo. Then it is edited to look like its in real wildlife.", "correlation": 0.5268221235748114}, {"start": 78, "text": "How do you guys get this footage without disturbing or scaring the animal", "correlation": 0.5190283930804569}, {"start": 78, "text": "At 1:18 I saw the branch move and just nonononoNONONO BABY", "correlation": 0.5080995741058805}, {"start": 78, "text": "what is the name of this animal? the dont tell it in video or description: downvote.", "correlation": 0.5076829197377984}, {"start": 78, "text": "All of these nature videos lose all meaning once you realize the whole thing is staged and the animals are in fact being forced into a narrative. Not saying the \"information\" is wrong, or a lie, but the whole video aspect is simply a story they weave together to keep your attention.", "correlation": 0.49806008529124324}, {"start": 78, "text": "THESE WILD ANIMALS ARE TERRIFYING ! ! ! CHILDREN SHOULD NOT WATCH SUCH VIDEOS ! ! !", "correlation": 0.49603021604996145}, {"start": 78, "text": "I've been watching Nat Geo/BBC since I was a child and it just occurred to me that they capture these crazy-ass shots without being \"seen\"/detected by the animals. Also, part of me feels as though foley artist go in after the video has been filmed and create sound effects. Everything sounds a bit too crisp to be from the portrayed source.", "correlation": 0.4934759115491019}, {"start": 78, "text": "I always wonder how they film all of this without making the animal scared or aware of them being there", "correlation": 0.48859431702349904}, {"start": 78, "text": "World's cutest animal documentary.", "correlation": 0.48647314830330673}, {"start": 78, "text": "Its a wild animal.", "correlation": 0.48457412586075443}, {"start": 78, "text": "“Even if it can get them into trouble”  “MEEEOWWWW”", "correlation": 0.4843877873141374}, {"start": 78, "text": "First video of bbc where i dont see animal eating each other", "correlation": 0.48058954823794203}, {"start": 78, "text": "Am I the only one who always gets fascinated by how they get this good footage and follow the animal around lol", "correlation": 0.47917399787178144}, {"start": 79, "text": "1:19 don’t say that. I honestly thought some predator was gonna come and eat it or something", "correlation": 0.5406940820329779}, {"start": 79, "text": "1:19 Even if it can get into trouble Baby Kitten falls off a stick meow🥺😍🩷", "correlation": 0.5006312010056129}, {"start": 79, "text": "That meow... 1:19", "correlation": 0.485314794406255}, {"start": 80, "text": "1:20   Tree: breaks Cat: DRAMATIC MEW", "correlation": 0.5754398869462285}, {"start": 80, "text": "1:20 The cameraman is like \"Aaaawwwwwww cute c:\"", "correlation": 0.5170438439654048}, {"start": 80, "text": "1:20 he fell with a wee meow 🥰 🥺", "correlation": 0.502019485947555}, {"start": 80, "text": "1:20: Cat falls and mews  Me: Dies", "correlation": 0.47469372059870973}, {"start": 80, "text": "1:20 That was like something out of a cartoon.", "correlation": 0.4346893881137425}, {" cumentaries: this animal is the most observant on the planet. its sensitive ears can detect any living creature in a 20 mile radius.  The nature photographer hidden 20 ft away from it: am I a joke to you", "correlation": 0.46446959406605204}, {"start": 88, "text": "Super senses.   For him thats just normal senses", "correlation": 0.46368455334730835}, {"start": 88, "text": "Where does on find such majestic animal", "correlation": 0.4624410381933531}, {"start": 88, "text": "I feel like I just watched the intro scene to the lion king", "correlation": 0.45359588346265844}, {"start": 88, "text": "İTS a cheeta", "correlation": 0.4505826288530853}, {"start": 88, "text": "This is rlly stupid and probably has an obvious answer but I always wondered how the animals never sense the cameraman? Like they never look in the direction the camera is even acknowledge them", "correlation": 0.4495652530004133}, {"start": 88, "text": "the being is curious about his world", "correlation": 0.44925327729678466}, {"start": 90, "text": "1:30 cat:there’s a camera around here somewhere. I know it.", "correlation": 0.5344329474173556}, {"start": 92, "text": "This rainforest looks like the setting from Ep1 of Walking With Beasts. And the little feline reminds me of the little prehistoric mammal protagonists hopping around in that episode, although they dont really look similar", "correlation": 0.5465713372566533}, {"start": 92, "text": "1:32 that looks almost animated", "correlation": 0.46938976531500165}, {"start": 92, "text": "Looks like a tiger X monkey", "correlation": 0.4641196524309948}, {"start": 92, "text": "Kevin Blanford i thought I was the only one who thought that haha. The movements at 0:42, 0:50, 1:14 and 1:32 (especially the jumping) feel a little too smooth... Idk maybe they’re so light that they move differently and I’m doubting because the close ups look so real, but there’s just something not quite right in its movements", "correlation": 0.4417964581486422}, {"start": 92, "text": "It's computer animated in some parts. Look at the movements at 1:32", "correlation": 0.4380600080751391}, {"start": 92, "text": "Next video showing monkeys", "correlation": 0.43283756522163136}, {"start": 92, "text": "monkey see monkey pet", "correlation": 0.4288272477777864}, {"start": 92, "text": "jumps over leaf", "correlation": 0.4267779901252104}, {"start": 92, "text": "Where is this forest  Asking for a friend 😂", "correlation": 0.42422692373694365}, {"start": 92, "text": "I actually gasped when it tripped on that branch. So precious.", "correlation": 0.40033792674547536}, {"start": 93, "text": "1:33 just like an animation scene motion hihee kawaii", "correlation": 0.5256805138907299}, {"start": 95, "text": "“WATCH OUT THERES A LEOPARD!!” The leopard:", "correlation": 0.5957737294679913}, {"start": 95, "text": "one thing disturbs me is that the camera guy had to crawl the ground to flim the tiny leopard lol", "correlation": 0.533331249273466}, {"start": 95, "text": "This leopard is smol.", "correlation": 0.48522659654494804}, {"start": 95, "text": "Awww the way  it moves in the water , looking like a leopard ^^", "correlation": 0.48266708685859633}, {"start": 95, "text": "it’s truly beautiful seeing an animal in their natural habitat", "correlation": 0.460516108174232}, {"start": 95, "text": "​ @This_wind_pun_blows they can encounter tiger and leopard in Indian forest", "correlation": 0.4485064440270488}, {"start": 95, "text": "Just read that it’s population is vulnerable due to habitat loss and humans poaching them, mistaking them for baby leopards…", "correlation": 0.44725351395713303}, {"start": 95, "text": "Lions and cheetahs, tremble in it's presence. King of the jungle", "correlation": 0.43434182874503297}, {"start": 95, "text": "This is more to the tiger or cheetah", "correlation": 0.42136788459066077}, {"start": 96, "text": "Imagine walking in the forest and then suddenly stepping on this cat", "correlation": 0.5737451370814418}, {"start": 96, "text": "Imagine you just go in the forest and then by mistake you step on CAT", "correlation": 0.5436756458917984}, {"start": 96, "text": "This cat: crossing a stream, climbing trees and jumping from stone to stone. Me: trying to get to sweets without leaving the bed", "correlation": 0.5311174441985396}, {"start": 96, "text": "That cat just walked on water", "correlation": 0.4892206364174031}, {"start": 96, "text": "Curiosity caused the cat to fall off a log.", "correlation": 0.4866602962427152}, {"start": 96, "text": "Ever put a bunch of rocks in a sock and whipped it around real fast then released it to slingshot into the distance. Kinda wanna see how far this cat would fly.", "correlation": 0.4721845523470055}, {"start": 96, "text": "This has been my cat's favorite video since she was a kitten.  She knows that branch is going to break and always tries to catch him.", "correlation": 0.4509981304992756}, {"start": 96, "text": "This cat must be the one to chase the dinosaurs off our planet, not the meteors.", "correlation": 0.45016861106611106}, {"start": 96, "text": "Imagine going for a bush walk and accidentally stepping on one of these cats", "correlation": 0.4423300745876103}, {"start": 96, "text": "Cat: falls off breaking branch cameraman: “haha do it again.”", "correlation": 0.43867490163927897}, {"start": 96, "text": "Doctor @ hospital: \"why are you here?\" Me: \"I fell off a cliff\" Cat: \"fell off a tree stump.\"", "correlation": 0.4221455815516449}, {"start": 96, "text": "It's like \"I stepped on my cat's tail,\" but now it's the whole cat.", "correlation": 0.4188043055114616}, {"start": 96, "text": "Let. me. step. on. the cat", "correlation": 0.4145635275543146}, {"start": 96, "text": "When that cat jumped over that river I would’ve slipped and face planted myself 😂", "correlation": 0.40820029823922577}, {"start": 96, "text": "@RektUniverse  One, nice strawman lol. Two, too smooth for a human, perhaps. For a cat, no problem, they move like that all the time, their bodies are built for that kind of agility.", "correlation": 0.40742033127678917}, {"start": 96, "text": "You can tell is CGI when he moves fast and they didn't want to bother creating wet fur so they covered it with a rock after it came out of the water... Technology is so impressive.", "correlation": 0.40737335331990343}, {"start": 96, "text": "Imagine if a huge rock falls on it while it's taking a tiny shit...", "correlation": 0.4054847121115532}, {"start": 96, "text": "Would like to see how he gets caught by a snake he did not see (because it didn’t move).", "correlation": 0.40473392297266253}, {"start": 96, "text": "what happens when it encounters a snake", "correlation": 0.40452339417942995}, {"start": 96, "text": "Imagine having one of these as a pet and it does that thing where it runs infront of you and you accidentally step on it", "correlation": 0.40325784068680354}, {"start": 98, "text": "Its movement looks almost animated", "correlation": 0.4783704724023106}, {"start": 98, "text": "Thank you!!! Why is no one else commenting this. I'm almost certain it's both cgi and real life capture. I think the close ups ups are real but the part where it leaps over the stream, crosses the pond and walks over the leaf look super animated ... My brain is so confused", "correlation": 0.468450178494343}, {"start": 98, "text": "How did the camera man chase it without scaring it away? 🤯", "correlation": 0.4525949934721661}, {"start": 98, "text": "This is very cute, but fake. At 1:33 and 1:38 I think it’s easy to tell that the cat is cgi, I’ve looked at other videos of the same kind of cat and it appears to be much bigger than it looks  in this video, I don’t know if this is for a project or something, but why would you lie about the worlds smallest cat? Sorry if this seems rude, I just don’t get it:", "correlation": 0.4423332027603435}, {"start": 98, "text": "This looks so fake. It doesn't move right to be a real animal.", "correlation": 0.4370857898908599}, {"sta tion": 0.5173418584902642}, {"start": 31, "text": "“He’ll soon be setting off on a solitary life...”    I’ve already prepped his home, food, toys so he won’t be lonely at all.", "correlation": 0.5139275469513513}, {"start": 31, "text": "Narrator: he'll soon be setting off on a solitary life, fending entirely for him self  Me:no! that's not fair🥺💔", "correlation": 0.5136274719260011}, {"start": 32, "text": "0:32 not a real cat, it didn’t instinctively chase the fly.", "correlation": 0.6169066086563572}, {"start": 34, "text": "It's a cat or kitten !!! Video was filmed in Amazon Forest", "correlation": 0.6178242428681813}, {"start": 34, "text": "Im quiet curious about how they filmed the cat.  Thinking they may have scented a food scent all over those areas from pond to pond to the tree branch to get it walk around and follow the scent to capture it as it moves.  Still, ingenious thinkin, planning & beautiful filmjng eitherway as always.", "correlation": 0.5814539748256308}, {"start": 34, "text": "video: *intense music plays 'lil cat: *falls of twig", "correlation": 0.5768386017937749}, {"start": 34, "text": "plot twist: they just let out a poor kitten in the forest to film it", "correlation": 0.566886850519156}, {"start": 34, "text": "i feel like whoever was following it probably has a bunch of footage of the cat looking scared as shit just trying to find shelter.. idk he looks deliberately placed in the woods like he's never been outside before it's weird", "correlation": 0.5637665181741848}, {"start": 34, "text": "it's like someone put a kitten in a Forrest and recorded it haha", "correlation": 0.5595998235241834}, {"start": 34, "text": "0:34 how can they be predators", "correlation": 0.5584295675632128}, {"start": 34, "text": "Well think that is cgi. cuz the cat fall from twigs", "correlation": 0.5533559949765755}, {"start": 34, "text": "@Squid1nkyy  As an animator, I can pretty much guarantee that this is not CGI. The reason the motion feels \"too fluid\" is because we're used to seeing cats at larger scales, so the cat in the video doesn't have the vibrations that we would expect due to the weight of a larger animal. Likewise, the waxy leaves in the rainforest may diffuse light in a way that looks strange to someone unfamiliar with that environment. In the specific shots you mentioned, look at the way the light penetrates the cat's skin but not the underlying bone, the way the little sprouts and leaves move as the cat jumps over the big leaf, the way the cat's fur clumps as it touches the water, etc., etc., — these are the kinds of things a VFX team would be unlikely to include, especially on any kind of deadline.  Also — yes, the BBC has money, but they're still nowhere close to a Hollywood movie studio.  They simply don't have the manpower or budget to throw at cutting-edge VFX for random shots in a cat documentary. Look at the effects in Dr. Who for comparison — they're good, but nowhere close to photorealistic. What you're describing would be at the level of  Avatar: The Way of Water or better.", "correlation": 0.5445959377001122}, {"start": 34, "text": "That was a damn house kitten. The BBC is running out of animals to film. Now they're throwing their house pets into the local park and filming them close up.", "correlation": 0.5200412651133139}, {"start": 34, "text": "@munkimoto2294  it looks like someone green screened a house cat into some jungle floor footage.", "correlation": 0.5178309898915191}, {"start": 34, "text": "i watched this on an airline and when the cat first peeked out from behind a leaf i just straight up broke down crying", "correlation": 0.5166925234576086}, {"start": 34, "text": "The camera is so good that This looks like it was CGI with some close ups of a real kitten. Does anyone else think this looks fake? Especially when it jumps over the leaf", "correlation": 0.5078814878687883}, {"start": 34, "text": "Why do I feel someone just took their kitty into the nearest forest to film a documentary?", "correlation": 0.503205081494008}, {"start": 34, "text": "\"Hey Jeremy?\" Yeah? \"Where's that super rare cat you guys found?\" Yeeeeah, sorry about that. I was actually filming my cat in my back yard instead of filming that one... \"...Fuck it. Photoshop some trees in and call it a day.\" 😂😂😂", "correlation": 0.49866434559742806}, {"start": 34, "text": "@succulent951  Yes it is, you can clearly see it at the part where the cat jumps over the leaf. It looks too slow and fluid to be real.", "correlation": 0.49012586870388664}, {"start": 34, "text": "They just put a kitten in the forest and filmed it, you can't fool me BBC", "correlation": 0.489906637660346}, {"start": 34, "text": "@jackyzboub5607  \"cgi is quite easy\"? Bro you need to watch Corridor Crew, there is no button to make good CGI, it takes days, weeks and months of hard work. You don't just \"make a cgi cat appear\", you have to model the cat, which looking at how good this looks would take a long time, you would have to run physics simulations on the hair, they would also either have to make the water and leaf cgi as they interact with the cat, or they would have to have a real thing on set and digitally erase it out of every scene and replace it with a cat (a job that would require hours of painstaking manual erasure and replacement). You would also have to simulate the shadows to be captured realistically on the ground. At this point with all the replacing you'd need to do it would make more sense to make the whole video 100% cg and just use real footage as a reference for creating a digital environment, but that would still take a long time because of how good the environment looks and you'd still have to do a lot of work to make sure nothing clips and all the shadows look realistic on the textures. If it's so easy to find footage like that then go recreate this video for me, go find an animated model of a cat, throw it into a digitally recreated forest and tell me how good it looks, maybe then you'll realize that good looking cgi takes a lot of work, and it's not just putting a model into an environment and letting the magic cgi button do the rest.  I'm not saying this video isn't cgi, part of it probably is, but it most likely took way more work than you seem to think it did", "correlation": 0.4898303255879693}, {"start": 34, "text": "Producers: Aight y’all, for this vid, we’re going to throw a kitten into the jungle and use expensive cameras to follow it. Sound good?", "correlation": 0.4792567046736973}, {"start": 34, "text": "25 million views.  Of a cat, walking approx 40 feet through the woods. Doing dothing.", "correlation": 0.46201195871676404}, {"start": 35, "text": "Looks like someone put their kitten in the back yard and started filming", "correlation": 0.6184100670894193}, {"start": 35, "text": "This looks like they took a kitten and threw it in the forest to film it.", "correlation": 0.6147951375693916}, {"start": 35, "text": "Why does this feel like some guy took his kitten into the forest and started filming it.", "correlation": 0.6135676382139541}, {"start": 35, "text": "Anyone else notice they used a little red light to make the cat follow it at 0:35 ?", "correlation": 0.5717927317971898}, {"start": 35, "text": "0:35 apex predator", "correlation": 0.5703394036864521}, {"start": 35, "text": "I wonder how much of this is set up. Are the leaves placed there to make the cat look smaller. Is it just another fake session like the Polar Bear den footage, or the fake tree houses of native peoples that have been exposed. I struggle to believe BBC footage these days because they have been caught out in so many cheats.", "correlation": 0.5680272337047952}, {"start": 35, "text": "I in no way could restrain myself to film this... Me: (takes one look) \"KITTY!!\" stomps across marshland, likely falling on my ass because of leaves, and tears through the underbrush to grab said kitty", "correlation": 0.5671569701108317}, {"start": 35, "text": "Almost positive this is just someone’s kitten that BBC borrowed for 20 minutes just to film him walking through the forest acting like a jack ass", "correlation": 0.5589503076767304}, {"start": 35, "text": "“Fending entirely for himself” Me: HE CANT HES SMALLER THAN A LEAF", "correlation": 0.5312940312703832}, {"start": 35, "text": "Wtf. How have we NEVER heard of this before. They probably just filmed a kitten cheetah or whatever that was on its own. 🙄", "correlation": 0.5258047758811876}, {"start": 35, "text": "I feel like some British guy put his kitten in a jungle while touring the area and recorded him struggling to live.", "correlation": 0.5246491261540736}, {"start": 35, "text": "\"fending entirely for himself\" NOT IF I HAVE ANYTHING TO SAY ABOUT IT", "correlation": 0.5228585585526438}, {"start": 35, "text": "imagine that they doped up a kitten somewhere in the world, flying it around the globe to play in a 'nature' documentary. But yes I do have to agree, good footage.", "correlation": 0.519477673995731}, {"start": 35, "text": "\"fending for himself\" he will be fine, predators are gonna protect him", "correlation": 0.5087106498621508}, {"start": 35, "text": "Some dude just filmed his 4 month old kitten in his yard and sold it to the BBC.", "correlation": 0.5082887800480035}, {"start": 35, "text": "So someone took a kitten and bought a camera and filmed it in their backyard. You almost had me bbc lol", "correlation": 0.5082327530946394}, {"start": 35, "text": "I'm pretty sure they were lacking material and straight up started filming a random kitten alone in the forest", "correlation": 0.5071803645663104}, {"start": 35, "text": "0:35 looks like CGI", "correlation": 0.5049369895566123}, {"start": 35, "text": "“ Fending entirely for himself” me: Y O U  H A V E  T H E  R I G H T  T O  R E M A I N  S I L E N T ! ! !", "correlation": 0.4981398388100255}, {"start": 35, "text": "I was looking at the thumbnail and I thought “they must be trying to get views” then I saw the  actual organism wandering about in leaves  and realized this channel doesn’t play around.", "correlation": 0.49159175262635624}, {"start": 37, "text": "I love how the kitty is only half the size of that leaf! 0:37", "correlation": 0.7413230663403564}, {"start": 39, "text": "It looks like they purposely dropped some unusually large leaves on the ground to misrepresent the size of the animal", "correlation": 0.5074633646744443}, {"start": 39, "text": "It crawls over leaves", "correlation": 0.5007384576889302}, {"start": 39, "text": "It's movements are so smooth omg, like it went over that leaf barely touching it", "correlation": 0.4775712104275291}, {"start": 39, "text": "It had to jump over a leaf oh Lord.", "correlation": 0.44064194094656883}, {"start": 39, "text": "Steps on something.  Oops hopefully that was a leaf", "correlation": 0.43061695014234797}, {"start": 39, "text": "When it passed by the leaf, I cried 🥺😳", "correlation": 0.4161733738281947}, {"start": 39, "text": "How is it the size of a leaf???😓😓😓😓😲😲😲", "correlation": 0.40706474385416286}, {"start": 39, "text": "Fun fact it was a big leaf", "correlation": 0.40556676435917205}, {"start": 40, "text": "0:40 Either those leaves are as big as cars, or the cat is as small as they said it is.", "correlation": 0.6357976199532767}, {"start": 40, "text": "0:40  He looks up to a leaf", "correlation": 0.619090478471385}, {"start": 40, "text": "0:40 cat leaps over leaf thinking its poison", "correlation": 0.6187380607459085}, {"start": 40, "text": "0:40 its so cute how he went over the leaf instead of just stepping on it", "correlation": 0.5791985941071424}, {"start": 40, "text": "0:40 the fact he has to climb over a leaf is just so cute XD  Edit: Nothing anymore, read the comments to see a beeg arguement. (@jurassicfreak2579 forced me to change this in the most brutally mean way possible btw)", "correlation": 0.5729263309478145}, {"start": 40, "text": "BBC \"He's going to have to fend for himself\"  Little baby Kitty jumps over leaf 0:40", "correlation": 0.5404355510139115}, {"start": 40, "text": "0:40 My boy had to jump over a leaf. A LEAF.", "correlation": 0.5011190704934214}, {"start": 41, "text": "Chara LV18 and at 0:41 there are little droplets of water on the leaf. Also, there's still some green on some of the leaves and it could have something to do with the kind of tree it came from.", "correlation": 0.5607505414504421}, {"start": 41, "text": "0:41 He jumps over the leaf. That's strangely cute.", "correlation": 0.5586306369233982}, {"start": 41, "text": "Why isn’t anyone talking about how, at 0:41,   smol cat was SO CAREFUL to not hurt the leaf?", "correlation": 0.5076383208839421}, {"start": 41, "text": "0:41 to give you an idea of how small he actually is, this boi had to jump over a leaf there.", "correlation": 0.5040370743115762}, {"start": 41, "text": "He's like a mini ninja...watch how he crosses the leaf @0:41 ...a domestic cat wouldn't cross it with both front paws in the air.", "correlation": 0.499939112665315}, {"start": 41, "text": "0:41 OMIGOSH HES THE SAME SIZE OF THAT LEAF,,,", "correlation": 0.4247005235521474}, {"start": 42, "text": "0:42 the way he avoided the leaf", "correlation": 0.5743492896631}, {"start": 42, "text": "@theOneandOnly-u9w 0:42 jumping over the leaf is a big give away also the whole water bit after too", "correlation": 0.5258269289844061}, {"start": 42, "text": "That’s exactly what I was thinking when I saw 0:42, when the leaf doesn’t move at all and 0:52, which has a clearly edited shadow.", "correlation": 0.5066434789059799}, {"start": 42, "text": "0:42 wow. It walks OVER the leaf😂", "correlation": 0.49548869176916077}, {"start": 44, "text": "I’m here wondering how they follow and film it in the forest from every damn angle!!!", "correlation": 0.5671534404250579}, {"start": 44, "text": "It looks like it's filmed on a set or enclosed area. if you look at the landscape features, they are placed almost perfectly and sculpted to look cinematic. and the almost perfect looking placement and movement of camera/angles, there is a chance that its filmed over a long time and stitched to convey a story or narrative, or they just have cameras rigged in the enclosure that are remotely controlled. A lot of wildlife documentaries do this.", "correlation": 0.5597021329747937}, {"start": 44, "text": "Omg the camera quality's so good, the feline looks like cgi in 0:41-0:44 to me", "correlation": 0.5435203999388137}, {"start": 44, "text": "0:44 this looks animated or cgi", "correlation": 0.539220671151267}, {"start": 44, "text": "I'm only thinking this is not real bc the forest looks too perfectly organized         But I like the video its cute", "correlation": 0.5384509330368382}, {"start": 44, "text": "A lot of times these videos aren’t actually in the wild. They use animals they have at sanctuaries and set up backgrounds to make it look like they’re in the jungle. There’s a documentary about it and it was fascinating", "correlation": 0.5164106030818034}, {"start": 44, "text": "@uncletony6210  You might want to watch the BBC wild life series with Attenborough that go through exactly how they achieve the shots at the end of each episode. It's incredible the lengths they go to and how much planning/waiting goes into it.", "correlation": 0.5066727951442487}, {"start": 44, "text": "​ @Squid1nkyy  only the part where it jumps over the leaf looks unnatural. But you can't prove it's CGI. Idk what you on about when you say the entire forest is fake though", "correlation": 0.47093516569399085}, {"start": 44, "text": "@ToaAntan  it doesn’t look cgi at all. Most nature photographers spend a lot of time outside waiting for the right footage to appear.", "correlation": 0.449482295505056}, {"start": 44, "text": "The reason why this looks like CGI is because it's filmed in ultra HD, the BBC has started doing this years ago. It makes more details visible than you'd see with your own eyes if you were to see this in real life. Also, some shots aren't played at normal speed. You can see the jump over the stream is slowed down just a bit for example, but what you see is very much real and very much happened in front of the crew. Also, take into acount the added sound effects. No offense, but it bothers me a lot that some people nowadays can't see the difference anymore between real-life and CGI.  Especially in nature documentaries with obviously filmed shots shown with behind the scenes footage that's released with every aired documentary where you can see how the shots were made.", "correlation": 0.44909229818236546}, {"start": 44, "text": "I think they set cameras in the wild to keep track of nature without scaring away animals and stuff", "correlation": 0.44754656560804174}, {"start": 44, "text": "To me it seems like an animated and made up kind of video. Anyone can detect that special effects, or may be the photography is next level.", "correlation": 0.4292264081551199}, {"start": 44, "text": "@HorribleSmileProductions  I don’t doubt it. In my opinion it doesn’t look like cgi. Some shots, like the one with the big tree does look odd, but it could be how it was filmed or edited.", "correlation": 0.42818813163717334}, {"start": 44, "text": "I truly wish someone to explain how they shoot those videos! I mean what kind of wizard cameraman doing all this work ! I wanna shake his /her hand 🤔", "correlation": 0.4277251620726733}, {"start": 44, "text": "How do they film this?", "correlation": 0.4237944884602721}, {"start": 44, "text": "I want to know one thing that how these shots are shot they look amazing . I love these types of videos", "correlation": 0.4223625051050665}, {"start": 44, "text": "How the hell do they capture this footage?! Amazing", "correlation": 0.40962037792827877}, {"start": 44, "text": "@MohamedDoha  have you ever heard of work? yeah the ones who took these footages are professionals in their field. they will camp in these jungles for days, some of them would even do it for months", "correlation": 0.4093652519113909}, {"start": 44, "text": "This is amazingly cute and how did they film this", "correlation": 0.40794060453648867}, {"start": 44, "text": "I want it to be real, but I thought the same thing it seems like it would b more well known... i thought maybe they just filmed it next to really big leaves or something. It looks about as big as a squirrel", "correlation": 0.4071310168233935}, {"start": 45, "text": "0:45 perfect tree roots", "correlation": 0.8107190687378971}, {"start": 45, "text": "0:45 What he lacks in size... he make up for by being so CUUUUUUUUUUUUUUUUUTE.", "correlation": 0.6204306715957699}, {"start": 45, "text": "\"What he lacks in size.......\"  ....he doesn't make up anywhere else really.", "correlation": 0.5939427339062637}, {"start": 45, "text": "This is fake with CGI . cuz it shows him being as small as leaves  but then at 0:45 and compare him to the tree's trunk. and all the leaves on the ground.  that cat cant fit on the palm of your hand.", "correlation": 0.5900605784456652}, {"start": 45, "text": "0:45 No it is actually  What he lacks in size he makes up for cuteness. Where can I get one of these?", "correlation": 0.5825020239050438}, {"start": 45, "text": "\"What he lacks in size...\" write that down, write that down!", "correlation": 0.5708584810495891}, {"start": 45, "text": "What he lacks in size , he makes up for in smallness", "correlation": 0.5673381359440841}, {"start": 45, "text": "“what he lacks in size” lmao", "correlation": 0.5668043526815147}, {"start": 45, "text": "0:45  BBC Guy: He lacks in size  Me: That makes him 100 times better!", "correlation": 0.5665269855559943}, {"start": 45, "text": "What he lacks in size he makes up for         That’s what she said", "correlation": 0.5518118700197631}, {"start": 45, "text": "He walks by multiple leaves in this video, jumps over one, and climbs two branches", "correlation": 0.5435033142677201}, {"start": 45, "text": "Do people even have a clue how \"nature\" videos are made? There is more lighting and audio production and RETAKES than you could imagine, even within this less than 2 minute clip.", "correlation": 0.5416050152146749}, {"start": 45, "text": "This video needs to be longer, we only got to see how small it was compared to the tree but we don’t know if the tree is huge or small.", "correlation": 0.5404190227821827}, {"start": 45, "text": "0:45 \"what he lacks in size he makes up for in daring\" puts one paw in the river and retreats", "correlation": 0.5394814563612877}, {"start": 45, "text": "In what he lacks in size, he makes up for 🙈🙈🙈", "correlation": 0.5388258289330148}, {"start": 45, "text": "What he lack in size.....oh who am I kidding, this thing is adorable!", "correlation": 0.534888777656755}, {"start": 45, "text": "This was all filmed inside a square box with a forest in it.", "correlation": 0.5302900039956625}, {"start": 45, "text": "What he lacks in size, he makeup for in daring", "correlation": 0.5266927582424307}, {"start": 45, "text": "Okay so why does 0:40-0:45 look Cgi lol", "correlation": 0.5220216076394909}, {"start": 45, "text": "What he lacks in size.... he makes up for...... in BALLS!", "correlation": 0.5208261487739879}, {"start": 46, "text": "@СашаЛобанов-я8в  0:46 it is a tree,not a big tree i know. pls look how big is this little citty, and in the jungle theere givs realy big leaves ;) it is only a little fake^^ filter 4 cameras ;)", "correlation": 0.6956615303296841}, {"start": 46, "text": "0:46 \"What he lacks in size, He makes up for ..... in daring.\" 💪", "correlation": 0.6144265895094367}, {"start": 46, "text": "0:46 Welcome to Jurassic Park!", "correlation": 0.5098379895685486}, {"start": 48, "text": "It’s hard to get through my head that there’s a camera man in the forest", "correlation": 0.5710720165936665}, {"start": 48, "text": "Kinda feels like this was filmed not in a forest, but in a zoo or smth", "correlation": 0.5710063353660586}, {"start": 48, "text": "I’d like to think it’s because the cameraman was so perfectly disguised as a tree", "correlation": 0.5270648042134898}, {"start": 48, "text": "@holliswilliams8426  this was filmed in a zoo, my ignorant friend. You remember the chainsaw noise bird? that was in a zoo too. They used that bird as a message, to say \"deforestation is so close to this poor birds home\" to make you emotional. When really, it heard chainsaws because its in a zoo. Youd never ever capture a wild one making chainsaw sounds.", "correlation": 0.5213341849772923}, {"start": 48, "text": "The forest at places did look somewhat like a set from a movie.", "correlation": 0.5156810839278797}, {"start": 48, "text": "Imagine how many cameras were set in that forest.", "correlation": 0.5134663700377998}, {"start": 48, "text": "Where is that forest ?", "correlation": 0.5104373455763153}, {"start": 48, "text": "It always amazes me to think about how we got this kind of footage of nature.", "correlation": 0.49819720884491625}, {"start": 48, "text": "This is a kitten, not a grown male. If you guys don´t believe what Mauri QHD says, then google pictures of them. You will see the difference between kitten and adult. Then the cat seems first really small, almost like only a handful, but if you see it at 0:48 and compare it to the first seconds, there is a huge difference. The leaves look extremly big, but at 0:48 they are all of a sudden way smaller then the cat. If you google the size of the cat you will see, that it is 35-48 cm big, without its tail, which is 15-30 cm long. So before judging Mauri QHD´s therorie, inform youself about the possibility like i did and not believe every shit that´s shown in a tv show. Sorry for my bad english, but i hope you get what i´m talking about.", "correlation": 0.4912094952855828}, {"start": 48, "text": "This video makes nature look too nice.", "correlation": 0.48076968041048085}, {"start": 48, "text": "Behold, the Forest Everkitten.", "correlation": 0.4793024585946479}, {"start": 48, "text": "Well its not like cameramen chase animals through the woods", "correlation": 0.4624998522077227}, {"start": 48, "text": "What is the forest name ? Cause in want one 😊", "correlation": 0.4597751418816236}, {"start": 48, "text": "@Sticks-q5i  And of course the forest would be made for this video. Or maybe for 2 or 3 other animals. Do you know how rich BBC is?", "correlation": 0.45972236975668396}, {"start": 48, "text": "I ❤️ the forest. 👍", "correlation": 0.4564193994547032}, {"start": 48, "text": "the BBC are truly the masters of filming nature scenes", "correlation": 0.4472246453130814}, {"start": 48, "text": "The forest is a paid actor", "correlation": 0.4464133924276565}, {"start": 48, "text": "next time i enter a forest: PSPSPSPSPSPSP", "correlation": 0.4434774752531154}, {"start": 48, "text": "It's like a enchanted forest", "correlation": 0.4324836582542313}, {"start": 48, "text": "they cut out the part where he made an entire tree collapse", "correlation": 0.4305922511640657}, {"start": 49, "text": "00:49 looks like VFX", "correlation": 0.5300268338743317}, {"start": 50, "text": "0:50 narrator: \"what he doesn't have in size he makes up for in daring\" smol cat: splashes water", "correlation": 0.7332313249376871}, {"start": 50, "text": "0:50 How your dog on skyrim enter the water after you go in", "correlation": 0.729915883627908}, {"start": 50, "text": "..in daring.. * crosses a stream..", "correlation": 0.6301001931631992}, {"start": 50, "text": "Cat:walks through water  Narrator: sO DaRiNg", "correlation": 0.5962283906929411}, {"start": 50, "text": "Just what I thought before the narrator said \"in daring\"", "correlation": 0.594223639339899}, {"start": 50, "text": "“He makes up in daring” Cat: touches water “INTERESTING”", "correlation": 0.5939299925695964}, {"start": 50, "text": "\"What he lacks in size he makes up for, in daring\" carefully touches water with paws", "correlation": 0.572538370894582}, {"start": 50, "text": "Daring barely walk through a stream of water", "correlation": 0.5673826693387546}, {"start": 50, "text": "the daring cat who crossed the water stream walking in it.", "correlation": 0.5650505673133628}, {"start": 50, "text": "\"what he lacks in size, he makes up in daring \"  puts paw gently in the water  Extremely daring 💕💕😩", "correlation": 0.5632886330748456}, {"start": 50, "text": "He timidly crossed a small shallow stream… gosh how daring.", "correlation": 0.5602363269981941}, {"start": 50, "text": "He makes up in daring.  swims across puddle", "correlation": 0.5498875292208028}, {"start": 50, "text": "\"daring\"...  Cat shakes the water from it's paw and walks away...", "correlation": 0.5480870203736944}, {"start": 50, "text": "\"What he lacks in size, he more than makes up for in daring\" cautiously pokes at shallow water \"Terrifying\"", "correlation": 0.5454955950076267}, {"start": 50, "text": "“What he lacks in size… He makes up for in daring.” As he paws at extremely shallow water.", "correlation": 0.54465560801987}, {"start": 50, "text": "Daring(they ain't afraid of water)", "correlation": 0.5440788949174523}, {"start": 50, "text": "And daring steps in water", "correlation": 0.5428052565355023}, {"start": 50, "text": "\"What he lacks in size he makes up for in daring\" touches water, instantly pulls paw back", "correlation": 0.5415066138492164}, {"start": 50, "text": "It touched the stream to see if it's too cold for him to swim through. Smart little cute thing.😀", "correlation": 0.5390606673318209}, {"start": 50, "text": "“What he lacks in size, he makes up for in daring.”  proceeds to gently touch water with paw", "correlation": 0.5354292378302474}, {"start": 51, "text": "0:51 \"Daring\" Touches water and backs off", "correlation": 0.7340712533330739}, {"start": 51, "text": "the title should be the cat that isnt afraid of water 0:51", "correlation": 0.5825179490196815}, {"start": 51, "text": "BaigL 0:51 This scene where the cat crosses the stream here looks incredibly CG. T
