ed far more than those celebrity judges ever will in thier lifetimes but the old man had one last thing to check off on his bucket list...... and that was to rock out on AGT! 😎 Mission accomplished sir 💯🎯", "correlation": 0.4113770896454009}, {"start": 25, "text": "If I was a judge he would get golden buzzer", "correlation": 0.4079357733986042}, {"start": 30, "text": "Some of the judges need to unclinch their a$$holes and enjoy this man's awesomeness!", "correlation": 0.536700607598182}, {"start": 30, "text": "The look on the judges faces tell the whole story, great job.", "correlation": 0.5363474752487258}, {"start": 30, "text": "When the 82 year old aerospace engineer is less grumpy than the judges", "correlation": 0.5291524853871213}, {"start": 30, "text": "The judges giving that smirk shows they know nothing beyond pop music and 4 chords", "correlation": 0.515586681753689}, {"start": 30, "text": "Judges: How metal are you Old dude: METALLY UNSTABLE", "correlation": 0.5085887943209494}, {"start": 30, "text": "Oh that was karaoke for sure", "correlation": 0.49617137489226554}, {"start": 30, "text": "It's a shame that the video is cut before the judges's comments, I wanted to hear them... Respect for this man, by the way.", "correlation": 0.49483744613752967}, {"start": 30, "text": "He is better than the four judges...he was former aerospace engineer and navy pilot..... and metalhead...what better than that? Rock in peace sir 🤘", "correlation": 0.49483703315020594}, {"start": 30, "text": "Fuck those judges. The dude came here to have the time of his life", "correlation": 0.48647130275176625}, {"start": 30, "text": "That's the coolest gramp on the planet and the judges are laughing at him xD they don't understand metal the corporate goons 🤣", "correlation": 0.4772096135114494}, {"start": 30, "text": "Maz3cubed that what makes it funny about this video...if I was a judge I'll do the same thing LOL", "correlation": 0.473913270777613}, {"start": 30, "text": "Blonde judge: uhhh what’s he singing….? I don’t know what good music is….", "correlation": 0.4690678884067398}, {"start": 30, "text": "Too great for those judges :D", "correlation": 0.4630661214846342}, {"start": 30, "text": "Ok TBH if any of the judge press the buzzer I will rip my nuts out 😂😂 fking hell this 82yr man just fking do metal like that some fking balls to do for a 82yr 😆👍👏👏", "correlation": 0.4609852473730814}, {"start": 30, "text": "my grandpa on karaoke night", "correlation": 0.4608421891027249}, {"start": 30, "text": "That moment everyone in the jury realised that this man is better in almost every regard than anyone of them when he mentioned what he was doing before. ;-)", "correlation": 0.45459736075111323}, {"start": 30, "text": "Luka Ellis right... didn't you hear that his voice was kind of finishing while the judge was laughing at him lol 😆😆😆😆", "correlation": 0.4482644556599602}, {"start": 30, "text": "I did this and my schools karaoke night", "correlation": 0.44705014526715886}, {"start": 30, "text": "What a boss! It always great to see when old people don't go the well trodden sympathy path with lame ass mainstream pop, but start spitting fire or rock the shit out of the judges", "correlation": 0.44205036134759995}, {"start": 30, "text": "karaoke good", "correlation": 0.4418266381211144}, {"start": 33, "text": "Geriatric nurse, I have tears in my eyes.", "correlation": 0.40508005674674136}, {"start": 33, "text": "I know what I want to do when I retire.🎉", "correlation": 0.40297406231580707}, {"start": 35, "text": "Aerospace Engineering! That's what I'm studying!", "correlation": 0.4593093269923227}, {"start": 35, "text": "Damn this man did Aerospace engineering. Such an interesting man", "correlation": 0.42054935939377674}, {"start": 35, "text": "AEROSPACE ENGINEERING IS WHAT I WANT TO MAJOR IN AT UC DAVIS OMG!", "correlation": 0.41435025876254133}, {"start": 35, "text": "That’s cool cause I’m wanting to be an aerospace engineer", "correlation": 0.4124 7443390589664036}, {"start": 48, "text": "OMG that is incredible", "correlation": 0.4532468133127783}, {"start": 48, "text": "That’s insane", "correlation": 0.4464217086820456}, {"start": 48, "text": "this is incredible", "correlation": 0.437995017419307}, {"start": 48, "text": "Incredible", "correlation": 0.4362335770953204}, {"start": 48, "text": "INCREDIBLE LOL", "correlation": 0.4329273855418414}, {"start": 48, "text": "Dude that's amazing", "correlation": 0.4271531672268385}, {"start": 48, "text": "I showed this to my dad and he is amazed and fascinated by this amazing man", "correlation": 0.41831772937179146}, {"start": 48, "text": "That was incredible", "correlation": 0.4058000926807124}, {"start": 49, "text": "Man can hold a note", "correlation": 0.5469350241468286}, {"start": 50, "text": "I was an aerospace program manager....Did you go into space?", "correlation": 0.5218100873875638}, {"start": 50, "text": "Mad respects to this gentleman man, went to outer space so to speak,  back & fourth now a television star😎🤟🤘nuff said...", "correlation": 0.42951099105620844}, {"start": 50, "text": "YES!!!!! Navy, Hubble, then Drowning....", "correlation": 0.4266559620833495}, {"start": 52, "text": "Did you go into space? I didn't say I was a astronaut..", "correlation": 0.5922349011225292}, {"start": 52, "text": "\"did you go into space?\"", "correlation": 0.5232212464235146}, {"start": 52, "text": "I think he was in space on stage", "correlation": 0.4901963325761065}, {"start": 52, "text": "Simon: \"Did you go to space?\" John: Not this question again, such a plebeian.. stfu and just let me rock your world Kid.", "correlation": 0.4013386721057842}, {"start": 54, "text": "I was a navy pilot, that was far enough in to space..... 0:54", "correlation": 0.6706544061488076}, {"start": 54, "text": "Did you go to space? What a moron", "correlation": 0.5753550901403575}, {"start": 54, "text": "Did he say he went to space too?", "correlation": 0.5134288615161486}, {"start": 54, "text": "“Did you go to space” 🤣🤣🤣", "correlation": 0.498286516098814}, {"start": 54, "text": "\"Did you got to space\"    What a dumb question.", "correlation": 0.4897420655851381}, {"start": 54, "text": "HAHAHAHA SPACE! NOBODY GOES TO SPACE!", "correlation": 0.471084558293218}, {"start": 58, "text": "This is a man who has lived his life to the fullest. From job to retirement to showing the world a 80 year old can still rock", "correlation": 0.4608492490954186}, {"start": 58, "text": "One time a pilot accidentally went into space", "correlation": 0.44783673527852436}, {"start": 58, "text": "This dude flew in the Navy, navigated the Hubble to space, and screamed Drowning Pool on live TV at 82.  Only thing better would've been a big F you flip off at the end followed by a mic drop.", "correlation": 0.4443660726311932}, {"start": 58, "text": "He is my hero too. Imagine if he said he is 102 years old and \"I was a navy pilot during world war 2 and it was far enough into space\", damn the audience would applaud him for a few minutes.", "correlation": 0.44393059224057146}, {"start": 58, "text": "82 years old… Rocket scientist… Navy Pilot… Karaoke Star… Legend.", "correlation": 0.42611903305386073}, {"start": 58, "text": "Greatest old man ever", "correlation": 0.4203596747072434}, {"start": 58, "text": "Navy pilot Space Engineer now   still young at hearts 😊", "correlation": 0.416073937232135}, {"start": 58, "text": "0:58 dude knows space is fake", "correlation": 0.4126566402702756}, {"start": 58, "text": "This is the coolest old man I’ve ever seen", "correlation": 0.41180269450610407}, {"start": 58, "text": "Coolest old man I’ve ever seen.", "correlation": 0.4089858731280997}, {"start": 58, "text": "This old man is fucking awesome", "correlation": 0.4056847758720527}, {"start": 58, "text": "This old man is probably the coolest one that I ever saw..", "correlation": 0.4049615885997786}, {"start": 58, "text": "LOVE THIS OLD MAN. From the Hubble to drowning pool that old man served the Korean war Irogima then in Vietnam. Rock out Sir Thank you for serving", "correlation": 0.4027249215906765}, {"start": 58, "text": "God bless this wonderful man! Hubble Telescope, before that a Navy pilot, and now he wants to sing metal. I'm ex-Navy too, and feeling the back end of my 30's, this man inspires me to do more and I love him for it!", "correlation": 0.40135323850862126}, {"start": 60, "text": "is that buffy the vampire slayer as a judge on the panel?", "correlation": 0.5130711138816961}, {"start": 60, "text": "Awe", "correlation": 0.5022529970713647}, {"start": 62, "text": "This guy has accomplished more in his life than the whole row of judges on this show", "correlation": 0.47794979167354684}, {"start": 62, "text": "Would have loved to be there, WINDMILL!!!!! No matter how he preformed, his contribution to the human race far outstrips anything the Judges have ever done and ever will do.", "correlation": 0.4629190470041721}, {"start": 62, "text": "This makes me want to go on the show", "correlation": 0.43630003639492454}, {"start": 62, "text": "If it were up to the audience he would've won", "correlation": 0.40279429054797783}, {"start": 62, "text": "I would like to believe the audience and jury got blown away because he covered it perfectly but the more i listen to it the more i think all were just well.. surprised. I'm rating his performance on stage not his lifetime achievements ok? The greatest thing i have ever done was to make myself a sandwich. Its true he deserves respect for even being able to yell this much without fucking dying right away at his age. I cant imagine myself doing something like this at age of 250. But i don't really understand why jury was like °o° when it wasn't what it was supposed to be.", "correlation": 0.4021469469914514}, {"start": 62, "text": "you see the most interesting people on this show", "correlation": 0.4003713720627009}, {"start": 64, "text": "I love how this old man is just having so much fun on stage", "correlation": 0.6087573679584354}, {"start": 64, "text": "What a cool old dude, had me smiling the whole time.", "correlation": 0.49289860784731404}, {"start": 64, "text": "Entertaining ,heart to be on stage ,but stay retired . Bet hus grand kids have heard this hollering before 😂.", "correlation": 0.4424937586855369}, {"start": 64, "text": "Wow! Now I know what answer to give the next time I'm asked.... \"Where do you wanna be in your life 30 years from now?\" Me: Trying to fill this man's stage shoes...", "correlation": 0.4216465168612477}, {"start": 64, "text": "I love how pumped this old dude got the audience. this dude had a bad ass life.", "correlation": 0.42102929215941165}, {"start": 64, "text": "So this is what conan gonna be like at 82.", "correlation": 0.4116866309881904}, {"start": 64, "text": "He's 82 years-old(at the time) and is a retired aerospace engineer who oversaw work on an instrument that repaired the Hubble, he without a doubt has more money than the prize for winning AGT. He was just there to have fun melting everyone's faces with his epic voice 🤘", "correlation": 0.4039955647986196}, {"start": 64, "text": "Old man just living his life and having all the fun he can God bless him", "correlation": 0.40145864067867076}, {"start": 64, "text": "He's keeping it real. An aging man getting older nearing death every day. \"Something's got to give.\"  His health? His heart? Body hit the floor.  I hope he lives as long as possible to show the world to have fun.", "correlation": 0.4003113291353426}, {"start": 64, "text": "This dude is a legend. Spent his life as winner and went on tv to have some fun. Ps : he has a better voice than axl rose nowdays lol", "correlation": 0.40031013748584005}, {"start": 65, "text": "Judges included", "correlation": 0.6445205804641116}, {"start": 65, "text": "Fucking crowd and ''judges\".", "correlation": 0.604263438821268}, {"start": 65, "text": "watching this, the oldest people in this audience were judges", "corr       document.addEventListener('mousemove', doDrag);
      document.addEventListener('mouseup', endDrag);
      progressContainer.addEventListener('click', (e)=>{ if(!isDragging) seekVideo(e); });

      // 리사이즈 시 현재 떠있는 단무쿠 위치/퇴장 판정 보정
      window.addEventListener('resize', () => {
        // 큰 레이아웃 변화에서는 간단히 리셋
        resetDanmakuForSeek();
      });

      // 초기 상태
      updatePlayPauseButton();
    });

    function togglePlayPause(){ if(video.paused) video.play(); else video.pause(); }

    function updatePlayPauseButton(){
      if(!video) return;
      if(video.paused){
        playIcon.style.display='block';
        pauseIcon.style.display='none';
      } else {
        playIcon.style.display='none';
        pauseIcon.style.display='block';
      }
    }

    function updateTimeDisplay(){
      if(!video || !video.duration) return;
      const cur = formatTime(video.currentTime || 0);
      const tot = formatTime(video.duration);
      timeDisplay.textContent = cur + ' / ' + tot;
    }

    function onTimeUpdate(){
      if(!video) return;
      const t = video.currentTime || 0;

      // 진행바
      if(video.duration){
        progressBar.style.width = ((t / video.duration) * 100) + '%';
      }
      updateTimeDisplay();

      // 직전 프레임 ~ 현재 사이에 start가 들어온 댓글만 트리거
      danmakuComments.forEach(function(cmt, idx){
        if(cmt.start > lastVideoTime && cmt.start <= t && !activeDanmaku.has(idx)){
          const delay = Math.random() * 200; // 0~200ms (원하면 제거)
          setTimeout(() => addDanmakuComment(cmt, idx), delay);
          if (!animationId) startAnimationLoop();
        }
      });

      lastVideoTime = t;
    }

    // ===== 진행바 제어 =====
    function startDrag(e){ isDragging = true; e.preventDefault(); updateVideoTime(e); }
    function doDrag(e){ if(!isDragging) return; e.preventDefault(); updateVideoTime(e); }
    function endDrag(){ if(!isDragging) return; isDragging = false; }
    function seekVideo(e){ updateVideoTime(e); }

    function updateVideoTime(e){
      const rect = progressContainer.getBoundingClientRect();
      const pos = clamp((e.clientX - rect.left)/rect.width, 0, 1);
      if (video.duration) {
        video.currentTime = pos * video.duration;
        // 시킹 처리: 떠있는 단무쿠 초기화 & 타임 마커 갱신
        resetDanmakuForSeek();
      }
    }

    // ===== 단무쿠 생성 / 애니메이션 =====
    function addDanmakuComment(cmt, idx){
      const div = document.createElement('div');
      div.className = 'danmaku-comment';
      div.id = 'danmaku-' + idx;

      const txt = (cmt.text ?? '') + '';
      div.innerHTML = '<div class="comment-text"></div>';
      div.querySelector('.comment-text').textContent = txt; // XSS 안전

      // 세로 위치: 댓글 텍스트 기반 결정적 위치 (여백 없음)
      const containerRect = videoContainer.getBoundingClientRect();
      // 댓글 텍스트를 해시값으로 변환하여 일관된 위치 생성
      const textHash = hashString(cmt.text || '');
      const maxHeight = containerRect.height - 25; // 전체 높이 사용
      const randomY = textHash % maxHeight; // 여백 없음

      // 먼저 붙여서 실제 너비를 잰다
      div.style.top = randomY + 'px';
      div.style.left = '0px';
      div.style.transform = 'translateX(0px)';
      div.style.transition = 'none';
      videoContainer.appendChild(div);

      const elWidth = div.getBoundingClientRect().width;

      // 시작 X: 컨테이너 오른쪽 바깥
      const startX = containerRect.width + 10; // +10 버퍼
      div.style.transform = `translateX(${startX}px)`;

      // 상태 저장
      activeDanmaku.set(idx, {
        element: div,
        currentX: startX,
        width: elWidth,
        y: randomY
      });

      // 애니메이션 루프 가동
      if (!animationId) startAnimationLoop();
    }

    function startAnimationLoop() {
      function animate(ts) {
        if (!lastRafTime) lastRafTime = ts;
        const deltaTime = (ts - lastRafTime) / 1000; // 초
        lastRafTime = ts;

        if (!isPaused) {
          updateDanmakuPositions(deltaTime);
        }

        // 루프 유지: 활성 단무쿠가 없고 비디오도 일시정지면 멈출 수 있음
        if (activeDanmaku.size === 0 && video?.paused) {
          animationId = null;
          lastRafTime = 0;
          return; // 루프 종료
        }
        animationId = requestAnimationFrame(animate);
      }
      if (!animationId) animationId = requestAnimationFrame(animate);
    }

    function updateDanmakuPositions(deltaTime) {
      // 모든 댓글 동일 속도 왼쪽 이동
      activeDanmaku.forEach((danmaku, idx) => {
        if (!danmaku || !danmaku.element) return;
        danmaku.currentX += DANMAKU_SPEED * deltaTime;

        // 완전 퇴장: 요소의 오른쪽 끝이 화면 왼쪽 밖으로 나가면 제거
        if (danmaku.currentX + danmaku.width < 0) {
          danmaku.element.parentNode?.removeChild(danmaku.element);
          activeDanmaku.delete(idx);
        } else {
          danmaku.element.style.transform = `translateX(${danmaku.currentX}px)`;
        }
      });
    }

    // ===== 시킹/재생 동기화 =====
    function pauseAllDanmaku() { isPaused = true; }
    function resumeAllDanmaku() { isPaused = false; if (!animationId) startAnimationLoop(); }

    function resetDanmakuForSeek(){
      // 떠있던 것들 제거
      activeDanmaku.forEach((d)=>{ d.element?.parentNode?.removeChild(d.element); });
      activeDanmaku.clear();
      // 다음 프레임 기준으로 새로 트리거
      lastVideoTime = video?.currentTime || 0;
      // 애니메이션 타임라인 초기화
      lastRafTime = 0;
    }
  </script>
</body>
